<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BROADCAST OVERRIDE</title>
    <style>
        :root {
            --alastor-red: #660000;
            --alastor-bright: #ff001e;
            --bg-dark: #030001;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-dark);
            color: var(--alastor-bright);
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            user-select: none;
        }

        .scanlines {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.7) 50%),
                        linear-gradient(90deg, rgba(255,0,0,0.05), rgba(0,255,0,0.01), rgba(0,0,255,0.05));
            background-size: 100% 4px, 6px 100%;
            z-index: 50;
            pointer-events: none;
        }

        #start-overlay {
            position: fixed;
            inset: 0;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            cursor: pointer;
        }

        .tune-btn {
            border: 2px solid var(--alastor-red);
            padding: 20px 40px;
            font-size: 1.5rem;
            color: #fff;
            background: #100003;
            box-shadow: 0 0 15px var(--alastor-red);
            letter-spacing: 4px;
            text-transform: uppercase;
            font-weight: bold;
        }

        .tune-btn:hover {
            background: var(--alastor-red);
            box-shadow: 0 0 30px var(--alastor-bright);
        }

        #main-frame {
            width: 90%;
            max-width: 950px;
            border: 3px solid var(--alastor-red);
            padding: 30px;
            box-shadow: 0 0 30px rgba(102, 0, 0, 0.8);
            background: rgba(8, 0, 2, 0.98);
            position: relative;
            z-index: 10;
        }

        .demon-header {
            text-align: center;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--alastor-red);
            padding-bottom: 10px;
        }

        .demon-title {
            font-size: 3rem;
            font-family: 'Impact', serif;
            letter-spacing: 6px;
            color: #ff0000;
            text-shadow: 3px 3px 0px #000, 0 0 10px var(--alastor-bright);
        }

        .demon-subtitle {
            font-size: 0.9rem;
            color: #8a7074;
            letter-spacing: 6px;
            text-transform: uppercase;
        }

        .status-title {
            text-align: center;
            font-size: 1.2rem;
            color: #fff;
            margin-bottom: 15px;
            animation: pulse 0.5s infinite alternate;
        }

        .progress-wrapper {
            background-color: #050001;
            border: 2px solid var(--alastor-red);
            height: 26px;
            position: relative;
            margin-bottom: 5px;
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #4a0000, var(--alastor-bright));
            box-shadow: 0 0 15px var(--alastor-bright);
        }

        .percentage-text {
            text-align: right;
            font-size: 1.2rem;
            font-weight: bold;
            color: #fff;
            margin-bottom: 15px;
        }

        .terminal {
            height: 220px;
            background-color: #000;
            border: 1px solid var(--alastor-red);
            padding: 10px;
            overflow: hidden;
            font-size: 0.78rem;
            color: #ff3333;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
        }

        .log-line {
            margin: 1px 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .tv-glitch {
            animation: broadcast-cut 0.08s infinite steps(2);
            filter: contrast(3) invert(0.1) hue-rotate(330deg);
        }

        @keyframes broadcast-cut {
            0% { clip-path: inset(40% 0 20% 0); transform: translate(-15px, 8px) skewX(20deg); }
            30% { clip-path: inset(10% 0 70% 0); transform: translate(12px, -5px) skewX(-15deg); }
            60% { clip-path: inset(80% 0 5% 0); transform: translate(-8px, 12px); }
            100% { clip-path: inset(0 0 0 0); transform: translate(0, 0); }
        }

        @keyframes pulse {
            from { opacity: 0.2; }
            to { opacity: 1; }
        }

        .tv-off-force {
            animation: collapse-screen 0.5s cubic-bezier(0.7, 0, 0.84, 0) forwards !important;
        }

        @keyframes collapse-screen {
            0% { transform: scale(1, 1); filter: brightness(5); }
            50% { transform: scale(1, 0.003); filter: brightness(10); }
            80% { transform: scale(0.002, 0.003); filter: brightness(20); }
            100% { transform: scale(0, 0); filter: brightness(0); opacity: 0; }
        }

        #static-canvas {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            opacity: 0; pointer-events: none; z-index: 5;
        }
    </style>
</head>
<body>

    <div class="scanlines"></div>
    <canvas id="static-canvas"></canvas>

    <div id="start-overlay">
        <div class="tune-btn">TUNE IN TO BROADCAST</div>
    </div>

    <div id="main-frame">
        <div class="demon-header">
            <div class="demon-title">ALASTOR</div>
            <div class="demon-subtitle">THE RADIO DEMON — TRANSMISSION OVERRIDE</div>
        </div>

        <div class="status-title" id="status-text">DOWNLOADING RADIO VIRUS...</div>
        
        <div class="progress-wrapper">
            <div class="progress-bar" id="progress-bar"></div>
        </div>
        <div class="percentage-text" id="percent-text">0.00%</div>

        <div class="terminal" id="terminal"></div>
    </div>

    <script>
        const overlay = document.getElementById('start-overlay');
        const progressBar = document.getElementById('progress-bar');
        const percentText = document.getElementById('percent-text');
        const terminal = document.getElementById('terminal');
        const mainFrame = document.getElementById('main-frame');
        const statusText = document.getElementById('status-text');
        const canvas = document.getElementById('static-canvas');
        const ctx = canvas.getContext('2d');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        function drawStatic() {
            const imageData = ctx.createImageData(canvas.width, canvas.height);
            const buffer = new Uint32Array(imageData.data.buffer);
            for (let i = 0; i < buffer.length; i++) {
                if (Math.random() > 0.8) buffer[i] = 0xff0000ff;
                else if (Math.random() > 0.95) buffer[i] = 0xffffffff;
            }
            ctx.putImageData(imageData, 0, 0);
        }

        const baseLogs = [
            "import socket, ssl, struct, ctypes, sys, os",
            "class RadioPayload(ctypes.Structure): _fields_ = [('freq', ctypes.c_ulong)]",
            "ctx = ssl.create_default_context(); ctx.check_hostname = False",
            "s = ctx.wrap_socket(socket.socket(socket.AF_INET, socket.SOCK_STREAM))",
            "CRITICAL: Allocating target buffer via VirtualAllocEx(0x7FFF0000)...",
            "FORGING VOODOO HANDSHAKE PACKETS (666.0 MHz)...",
            "HOOKING AUDIO DRIVERS -> BROADCAST FEED ESTABLISHED",
            "EXTRACTING CREDENTIAL VAULT & SYSTEM KEYS...",
            "sys.settrace(lambda frame, event, arg: OVERRIDE_LOGS())",
            "EXPLOITING CVE-2026-6660 PROTOCOL ESCALATION...",
            "SYSTEM LOCK: TRANSMISSION OVERRIDDEN BY ALASTOR"
        ];

        function generateMemoryLine() {
            const addr = "0x" + Math.floor(Math.random()*0xFFFFFFFF).toString(16).toUpperCase().padStart(8, '0');
            let hex = "";
            for(let i=0; i<8; i++) {
                hex += Math.floor(Math.random()*256).toString(16).toUpperCase().padStart(2, '0') + " ";
            }
            return `${addr}: ${hex} | DUMPING MEMORY`;
        }

        let progress = 0;
        let audioCtx, osc, droneOsc, gain, droneGain, toneInterval;

        function initAudio() {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            
            osc = audioCtx.createOscillator();
            gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(60, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();

            droneOsc = audioCtx.createOscillator();
            droneGain = audioCtx.createGain();
            droneOsc.type = 'sine';
            droneOsc.frequency.setValueAtTime(130, audioCtx.currentTime);
            droneGain.gain.setValueAtTime(0.05, audioCtx.currentTime);

            droneOsc.connect(droneGain);
            droneGain.connect(audioCtx.destination);
            droneOsc.start();

            toneInterval = setInterval(() => {
                if (!audioCtx) return;
                const now = audioCtx.currentTime;
                droneOsc.frequency.exponentialRampToValueAtTime(240, now + 1.2);
                droneOsc.frequency.exponentialRampToValueAtTime(110, now + 2.5);
                droneGain.gain.linearRampToValueAtTime(0.18, now + 1.2);
                droneGain.gain.linearRampToValueAtTime(0.04, now + 2.5);
            }, 3000);
        }

        function audioGlitch() {
            if (!audioCtx) return;
            osc.frequency.setValueAtTime(Math.random() * 900 + 100, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            setTimeout(() => {
                osc.frequency.setValueAtTime(60, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
            }, 80);
        }

        overlay.addEventListener('click', () => {
            overlay.style.display = 'none';
            if (document.documentElement.requestFullscreen) {
                document.documentElement.requestFullscreen().catch(() => {});
            }
            initAudio();
            startSequence();
        });

        function startSequence() {
            setInterval(() => {
                if (Math.random() > 0.7) {
                    canvas.style.opacity = Math.random() * 0.6;
                    drawStatic();
                    setTimeout(() => canvas.style.opacity = 0, 60);
                }
            }, 150);

            setInterval(() => {
                if (Math.random() > 0.6) {
                    mainFrame.classList.add('tv-glitch');
                    audioGlitch();
                    setTimeout(() => mainFrame.classList.remove('tv-glitch'), 100);
                }
            }, 300);

            setInterval(() => {
                if (progress >= 100) return;
                const line = document.createElement('div');
                line.className = 'log-line';
                
                if (Math.random() > 0.4) {
                    line.innerText = "> " + baseLogs[Math.floor(Math.random() * baseLogs.length)];
                } else {
                    line.innerText = "# " + generateMemoryLine();
                }

                terminal.appendChild(line);

                if (terminal.childNodes.length > 12) {
                    terminal.removeChild(terminal.firstChild);
                }
            }, 60);

            function stepLoading() {
                if (progress >= 100) return;

                let increment = Math.random() > 0.8 ? Math.random() * 12 : Math.random() * 1.5;
                progress += increment;

                if (progress >= 100) {
                    progress = 100;
                    progressBar.style.width = '100%';
                    percentText.innerText = '100.00%';
                    statusText.innerText = "BROADCAST COMPLETED. STAY TUNED...";
                    statusText.style.color = "#ff0000";
                    
                    setTimeout(executeAutomaticShutdown, 600);
                    return;
                }

                progressBar.style.width = progress + '%';
                percentText.innerText = progress.toFixed(2) + '%';

                let nextTick = Math.random() > 0.85 ? 400 : Math.floor(Math.random() * 80 + 40);
                setTimeout(stepLoading, nextTick);
            }

            stepLoading();
        }

        // Automatic Screen Shutdown + Prolonged Whistling/Test Signal Tone
        function executeAutomaticShutdown() {
            canvas.style.opacity = 1;
            drawStatic();

            if (audioCtx) {
                // Clear atmospheric loops
                clearInterval(toneInterval);
                
                // Mute existing generators
                gain.gain.setValueAtTime(0, audioCtx.currentTime);
                droneGain.gain.setValueAtTime(0, audioCtx.currentTime);

                // Create prolonged high-pitched broadcast whistle tone
                const toneOsc = audioCtx.createOscillator();
                const toneGain = audioCtx.createGain();

                toneOsc.type = 'sine';
                // Standard test whistle frequency (1000Hz tone)
                toneOsc.frequency.setValueAtTime(1000, audioCtx.currentTime);

                toneGain.gain.setValueAtTime(0.4, audioCtx.currentTime);
                
                toneOsc.connect(toneGain);
                toneGain.connect(audioCtx.destination);

                toneOsc.start();

                // Trigger screen crumple collapse while tone sustains
                setTimeout(() => {
                    mainFrame.classList.add('tv-off-force');
                    
                    // Fade out tone and close audio system after screen turns off completely
                    setTimeout(() => {
                        toneGain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.8);
                        setTimeout(() => {
                            audioCtx.close();
                            document.body.style.backgroundColor = '#000000';
                            canvas.style.opacity = 0;
                        }, 800);
                    }, 500);
                }, 200);
            }
        }
    </script>
</body>
</html>
