<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SYS.OVERRIDE // ALASTOR</title>
    <!-- Importing terrifying fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-deep: #050000;
            --alastor-crimson: #8b0000;
            --alastor-blood: #ff001e;
            --text-muted: #aa0000;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: #000;
            color: var(--alastor-blood);
            font-family: 'Share Tech Mono', monospace;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            user-select: none;
            cursor: crosshair;
        }

        /* --- HEAVY CAMERA/VHS GLITCH LAYERS --- */
        #vhs-noise {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: url('data:image/svg+xml,%3Csvg viewBox=%220 0 200 200%22 xmlns=%22http://www.w3.org/2000/svg%22%3E%3Cfilter id=%22noiseFilter%22%3E%3CfeTurbulence type=%22fractalNoise%22 baseFrequency=%220.85%22 numOctaves=%223%22 stitchTiles=%22stitch%22/%3E%3C/filter%3E%3Crect width=%22100%25%22 height=%22100%25%22 filter=%22url(%23noiseFilter)%22/%3E%3C/svg%3E');
            opacity: 0.15;
            mix-blend-mode: color-dodge;
            pointer-events: none;
            z-index: 40;
        }

        .scanlines {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.5) 50%);
            background-size: 100% 4px;
            z-index: 49;
            pointer-events: none;
        }

        /* Screen tearing animation wrapper */
        #glitch-wrapper {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            z-index: 10;
            display: none; 
            /* Chromatic aberration */
            text-shadow: 2px 0px 1px rgba(0, 255, 255, 0.5), -2px 0px 1px rgba(255, 0, 0, 0.5);
            animation: vhs-jitter 0.2s infinite;
        }

        @keyframes vhs-jitter {
            0% { transform: translate(0, 0) skew(0deg); }
            20% { transform: translate(-2px, 1px) skew(-1deg); filter: hue-rotate(5deg); }
            40% { transform: translate(2px, -1px) skew(1deg); }
            60% { transform: translate(-1px, 2px) skew(0deg); }
            80% { transform: translate(1px, -2px) skew(-1deg); filter: hue-rotate(-5deg); }
            100% { transform: translate(0, 0) skew(0deg); }
        }

        .severe-glitch {
            animation: severe-tear 0.1s infinite steps(2) !important;
            filter: contrast(3) invert(0.2) !important;
        }

        @keyframes severe-tear {
            0% { clip-path: inset(20% 0 80% 0); transform: translateX(-10px); }
            50% { clip-path: inset(60% 0 10% 0); transform: translateX(10px); }
            100% { clip-path: inset(40% 0 50% 0); transform: translateX(-5px); }
        }

        /* --- START BUTTON --- */
        #start-gate {
            position: fixed;
            inset: 0;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .btn-core {
            border: 2px solid var(--alastor-blood);
            padding: 20px 50px;
            font-size: 2rem;
            color: var(--alastor-blood);
            background: #000;
            font-family: 'Creepster', cursive;
            letter-spacing: 5px;
            text-transform: uppercase;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.5);
            cursor: pointer;
            transition: 0.1s;
        }
        .btn-core:hover {
            background: var(--alastor-blood);
            color: #000;
            box-shadow: 0 0 40px var(--alastor-blood);
        }

        /* --- ORGANIZED APP CONTAINER --- */
        #app-container {
            width: 100%;
            max-width: 500px;
            height: 85vh;
            max-height: 800px;
            position: relative;
            display: flex;
            flex-direction: column;
            background: transparent;
            padding: 20px;
        }

        .reticle {
            position: absolute;
            width: 25px; height: 25px;
            border: 3px solid var(--alastor-blood);
            box-shadow: 0 0 10px rgba(255,0,0,0.8);
        }
        .reticle.tl { top: 0; left: 0; border-right: none; border-bottom: none; }
        .reticle.tr { top: 0; right: 0; border-left: none; border-bottom: none; }
        .reticle.bl { bottom: 0; left: 0; border-right: none; border-top: none; }
        .reticle.br { bottom: 0; right: 0; border-left: none; border-top: none; }

        .status-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 20px;
            font-weight: bold;
        }

        .warning-box {
            border: 2px solid var(--alastor-blood);
            background: rgba(30, 0, 0, 0.6);
            text-align: center;
            padding: 15px;
            margin-bottom: 25px;
            animation: pulse-warn 1s infinite;
        }

        @keyframes pulse-warn {
            0%, 100% { box-shadow: 0 0 10px rgba(255, 0, 0, 0.2); }
            50% { box-shadow: 0 0 30px rgba(255, 0, 0, 0.8); border-color: #ff4444; }
        }

        .warning-box h2 {
            font-family: 'Creepster', cursive;
            font-size: 2rem;
            color: #fff;
            text-shadow: 0 0 10px red;
            margin-bottom: 5px;
            letter-spacing: 2px;
        }

        .warning-box p {
            font-size: 0.8rem;
            color: var(--alastor-blood);
        }

        .main-title {
            text-align: center;
            font-size: 3.5rem;
            font-family: 'Creepster', cursive;
            letter-spacing: 8px;
            color: var(--alastor-blood);
            text-shadow: 0 0 20px red, 0 0 40px darkred;
            margin-bottom: 25px;
        }

        .progress-info {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            color: #fff;
            margin-bottom: 8px;
        }

        #ip-target {
            color: var(--alastor-blood);
            text-decoration: underline;
        }

        .progress-bar-bg {
            width: 100%;
            height: 15px;
            background: #110000;
            border: 1px solid var(--alastor-blood);
            margin-bottom: 20px;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: var(--alastor-blood);
            box-shadow: 0 0 15px red;
        }

        .terminal-box {
            flex-grow: 1;
            width: 100%;
            overflow: hidden;
            font-size: 0.75rem;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
        }

        .log-line {
            margin: 2px 0;
            display: flex;
            gap: 10px;
        }

        .log-time { color: #880000; }
        .log-msg { color: var(--alastor-blood); }
        .log-msg.err { color: #fff; text-shadow: 0 0 5px #fff; }

        /* --- ENDING SEQUENCE --- */
        .power-down {
            animation: tv-collapse 0.3s cubic-bezier(0.1, 0.8, 0.1, 1) forwards !important;
        }

        @keyframes tv-collapse {
            0% { transform: scale(1, 1); filter: brightness(2); }
            50% { transform: scale(1, 0.005); filter: brightness(10); }
            100% { transform: scale(0, 0); filter: brightness(0); opacity: 0; display: none; }
        }

        #final-scare {
            position: fixed;
            inset: 0;
            background: #000;
            z-index: 999;
            display: none; 
            justify-content: center;
            align-items: center;
        }

        #jumpscare-img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            animation: frantic-stutter 0.05s infinite;
        }

        @keyframes frantic-stutter {
            0% { transform: translate(0, 0) scale(1); filter: hue-rotate(0deg) contrast(1.5); }
            33% { transform: translate(-10px, 15px) scale(1.05); filter: hue-rotate(90deg) contrast(2) invert(1); clip-path: inset(10% 0 30% 0); }
            66% { transform: translate(10px, -15px) scale(0.95); filter: hue-rotate(-90deg) contrast(3); clip-path: inset(40% 0 10% 0); }
            100% { transform: translate(0, 0) scale(1); filter: hue-rotate(0deg) contrast(1.5); clip-path: none; }
        }
    </style>
</head>
<body>

    <div id="vhs-noise"></div>
    <div class="scanlines"></div>

    <div id="start-gate">
        <div class="btn-core" id="init-btn">ENTER BROADCAST</div>
    </div>

    <div id="glitch-wrapper">
        <div id="app-container">
            <div class="reticle tl"></div>
            <div class="reticle tr"></div>
            <div class="reticle bl"></div>
            <div class="reticle br"></div>

            <div class="status-header">
                <span>PRTCL: ALASTOR_V2</span>
                <span id="sys-status">STATUS: OVERWRITING</span>
            </div>

            <div class="warning-box">
                <h2>SYSTEM BREACHED</h2>
                <p>CRITICAL UNAUTHORIZED ACCESS DETECTED</p>
            </div>

            <div class="main-title">A L A S T O R</div>
            
            <div class="progress-info">
                <span>TRGT_IP: <span id="ip-target">LOCATING...</span></span>
                <span id="perc-display">0.00%</span>
            </div>
            
            <div class="progress-bar-bg">
                <div class="progress-fill" id="p-bar"></div>
            </div>

            <div class="terminal-box" id="term-out"></div>
        </div>
    </div>

    <!-- The Final Jumpscare -->
    <div id="final-scare">
        <img id="jumpscare-img" src="d769884480dfdee13e47e0526d22f906.jpg" alt="Alastor">
    </div>

    <script>
        // Fetch actual IP address to display
        fetch('https://api.ipify.org?format=json')
            .then(response => response.json())
            .then(data => {
                document.getElementById('ip-target').innerText = data.ip;
            })
            .catch(() => {
                document.getElementById('ip-target').innerText = "192.168." + Math.floor(Math.random() * 255) + "." + Math.floor(Math.random() * 255);
            });

        const startGate = document.getElementById('start-gate');
        const glitchWrapper = document.getElementById('glitch-wrapper');
        let audioCtx, droneGain, whistleOsc, whistleGain;

        document.getElementById('init-btn').addEventListener('click', () => {
            // 1. Force a real device/browser freeze for 800ms
            const freezeUntil = Date.now() + 800;
            while (Date.now() < freezeUntil) {
                // Synchronous loop locks the UI thread, causing an actual freeze.
            }

            // 2. Init Audio
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            initAudio();

            // 3. Show interface and request fullscreen
            startGate.style.display = 'none';
            glitchWrapper.style.display = 'flex';
            if (document.documentElement.requestFullscreen) {
                document.documentElement.requestFullscreen().catch(()=>{});
            }

            startHackSequence();
        });

        function initAudio() {
            // Low rumbling distortion drone
            const drone = audioCtx.createOscillator();
            droneGain = audioCtx.createGain();
            drone.type = 'sawtooth';
            drone.frequency.value = 50;
            droneGain.gain.value = 0.1;
            
            const dist = audioCtx.createWaveShaper();
            dist.curve = new Float32Array(44100).map((_, i) => {
                const x = i * 2 / 44100 - 1;
                return (3 + 50) * x * 20 * (Math.PI / 180) / (Math.PI + 50 * Math.abs(x));
            });
            
            drone.connect(droneGain);
            droneGain.connect(dist);
            dist.connect(audioCtx.destination);
            drone.start();
        }

        function playDemonLaugh() {
            const now = audioCtx.currentTime;
            
            // Extreme synthetic laughing stutters
            for(let i=0; i<15; i++) {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'square';
                osc.frequency.setValueAtTime(250 - (i*10), now + (i*0.12)); 

                gain.gain.setValueAtTime(0, now + (i*0.12));
                gain.gain.linearRampToValueAtTime(1, now + (i*0.12) + 0.01);
                gain.gain.exponentialRampToValueAtTime(0.01, now + (i*0.12) + 0.1);
                
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now + (i*0.12));
                osc.stop(now + (i*0.12) + 0.11);
            }
        }

        const logs = [
            "DECRYPTING PRIVATE RSA KEYS...",
            "CAMERA NODE INTERCEPTED [REC ON]",
            "INJECTING VOODOO PAYLOAD...",
            "FIREWALL BYPASS: SUCCESS",
            "DUMPING SYSTEM MEMORY...",
            "DOWNLOADING USER.DAT HASHES",
            "OVERRIDING ROOT AUDIO DRIVER"
        ];

        function startHackSequence() {
            let progress = 0;
            const pBar = document.getElementById('p-bar');
            const pText = document.getElementById('perc-display');
            const term = document.getElementById('term-out');

            // Random Severe Glitches
            setInterval(() => {
                if(Math.random() > 0.7) {
                    glitchWrapper.classList.add('severe-glitch');
                    setTimeout(() => glitchWrapper.classList.remove('severe-glitch'), 150);
                }
            }, 300);

            // Progress Bar
            function updateProg() {
                if(progress >= 100) return;
                progress += Math.random() * 5 + 1;
                if(progress > 100) progress = 100;
                
                pBar.style.width = progress + '%';
                pText.innerText = progress.toFixed(2) + '%';

                if(progress >= 100) {
                    document.getElementById('sys-status').innerText = "FATAL ERROR";
                    setTimeout(triggerEnding, 1000);
                } else {
                    setTimeout(updateProg, Math.random() * 200 + 50);
                }
            }
            updateProg();

            // Terminal Spool
            function updateTerm() {
                if(progress >= 100) return;
                const line = document.createElement('div');
                line.className = 'log-line';
                
                const d = new Date();
                const timeStr = `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}:${String(d.getSeconds()).padStart(2,'0')}`;
                
                let msg = logs[Math.floor(Math.random() * logs.length)];
                let isErr = false;
                
                if (Math.random() > 0.4) {
                    msg = "0x" + Math.floor(Math.random()*0xFFFFFFFF).toString(16).toUpperCase().padStart(8, '0') + " : CRITICAL_FAIL";
                    isErr = true;
                }

                line.innerHTML = `<span class="log-time">${timeStr}>></span><span class="log-msg ${isErr ? 'err' : ''}">${msg}</span>`;
                term.appendChild(line);
                
                if(term.childElementCount > 10) term.removeChild(term.firstChild);
                
                setTimeout(updateTerm, 90);
            }
            updateTerm();
        }

        function triggerEnding() {
            // Stop drone, start holding whistle
            droneGain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            
            whistleOsc = audioCtx.createOscillator();
            whistleGain = audioCtx.createGain();
            whistleOsc.type = 'sine';
            whistleOsc.frequency.value = 1100;
            whistleGain.gain.value = 0.5;
            whistleOsc.connect(whistleGain);
            whistleGain.connect(audioCtx.destination);
            whistleOsc.start();

            // TV screen turn off effect
            glitchWrapper.classList.add('power-down');

            setTimeout(() => {
                // Total blackness
                glitchWrapper.style.display = 'none';
                document.getElementById('vhs-noise').style.display = 'none';
                document.querySelector('.scanlines').style.display = 'none';
                
                // Wait in the dark with the whistle...
                setTimeout(() => {
                    // Force final jumpscare image and laugh
                    whistleGain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                    document.getElementById('final-scare').style.display = 'flex';
                    playDemonLaugh();
                }, 1500);
            }, 300);
        }
    </script>
</body>
</html>
