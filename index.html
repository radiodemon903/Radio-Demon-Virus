<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RADIO_BROADCAST // ALASTOR</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');

  :root {
    --bg-color: #0d0102;
    --radio-red: #ff0033;
    --dark-red: #4a000d;
    --alastor-green: #00ff40; 
    --text-dim: #8c4a4a;
  }

  body, html {
    margin: 0;
    padding: 0;
    background-color: var(--bg-color);
    color: var(--radio-red);
    font-family: 'Share Tech Mono', monospace;
    height: 100vh;
    overflow: hidden;
    user-select: none;
  }

  .crt-overlay {
    position: fixed;
    top: 0; left: 0; width: 100vw; height: 100vh;
    background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.7) 50%);
    background-size: 100% 3px;
    z-index: 100;
    pointer-events: none;
    box-shadow: inset 0 0 140px rgba(0,0,0,0.95);
    animation: flicker 0.08s infinite;
  }

  @keyframes flicker {
    0% { opacity: 0.9; }
    50% { opacity: 1; }
    100% { opacity: 0.85; }
  }

  .main-ui {
    position: relative;
    width: 96%;
    max-width: 600px;
    height: 96vh;
    margin: 2vh auto;
    padding: 20px;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    z-index: 10;
  }

  .main-ui::before, .main-ui::after,
  .ui-corner-tl, .ui-corner-br {
    border-color: var(--alastor-green);
  }

  .main-ui::before { top: 0; left: 0; border-right: none; border-bottom: none; }
  .main-ui::after { bottom: 0; right: 0; border-left: none; border-top: none; }
  .ui-corner-tl { position: absolute; top: 0; right: 0; width: 30px; height: 30px; border-left: none; border-bottom: none; }
  .ui-corner-br { position: absolute; bottom: 0; left: 0; width: 30px; height: 30px; border-right: none; border-top: none; }

  .hex-bg {
    position: absolute;
    top: 50px; left: 0; width: 100%; height: 80%;
    font-size: 0.55rem;
    color: rgba(0, 255, 64, 0.05);
    word-break: break-all;
    overflow: hidden;
    z-index: -1;
    line-height: 1;
  }

  .header-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    border-bottom: 1px solid var(--dark-red);
    padding-bottom: 10px;
    font-size: 0.75rem;
    color: var(--text-dim);
    margin-bottom: 20px;
  }
  .header-grid div:nth-child(2) { text-align: right; }

  .alert-box {
    border: 1px solid var(--alastor-green);
    background: rgba(0, 255, 64, 0.08);
    padding: 10px;
    text-align: center;
    margin-bottom: 15px;
  }
  .alert-title {
    color: var(--alastor-green);
    font-size: 1.4rem;
    font-weight: bold;
    letter-spacing: 3px;
    text-shadow: 0 0 10px var(--alastor-green);
    animation: alertPulse 0.5s infinite;
  }
  .alert-sub {
    color: #99ffbb;
    font-size: 0.75rem;
    letter-spacing: 2px;
  }

  @keyframes alertPulse {
    0%, 100% { opacity: 1; text-shadow: 0 0 15px var(--alastor-green); }
    50% { opacity: 0.4; text-shadow: none; }
  }

  .hacker-brand {
    text-align: center;
    font-size: 1.7rem;
    color: var(--radio-red);
    text-shadow: 0 0 15px var(--radio-red), 0 0 30px #000;
    margin: 20px 0;
    animation: brandGlitch 1.5s infinite;
    font-weight: bold;
    letter-spacing: 2px;
  }

  @keyframes brandGlitch {
    0% { transform: skew(0deg); }
    10% { transform: skew(-15deg); filter: blur(1px); }
    12% { transform: skew(10deg); filter: none; }
    100% { transform: skew(0deg); }
  }

  .progress-section { margin-bottom: 20px; }
  .progress-header {
    display: flex;
    justify-content: space-between;
    font-size: 0.8rem;
    margin-bottom: 5px;
    color: #ccc;
  }
  .progress-track {
    width: 100%;
    height: 12px;
    border: 1px solid var(--text-dim);
    background: #000;
    position: relative;
  }
  .progress-fill {
    height: 100%;
    background: var(--radio-red);
    width: 0%;
    box-shadow: 0 0 15px var(--radio-red);
    transition: width 0.1s;
  }

  .terminal-box {
    flex-grow: 1;
    border: 1px solid var(--dark-red);
    background: rgba(40, 0, 10, 0.3);
    padding: 10px;
    overflow: hidden;
    font-size: 0.75rem;
    line-height: 1.5;
  }
  .log-row { display: flex; margin-bottom: 3px; }
  .log-time { color: var(--text-dim); margin-right: 10px; width: 65px; }
  .log-msg { color: #fff; flex-grow: 1; word-break: break-all; }
  .log-msg.green { color: var(--alastor-green); text-shadow: 0 0 5px var(--alastor-green); }
  .log-msg.red { color: var(--radio-red); }

  .severe-glitch {
    animation: screenTearChaos 0.12s infinite;
  }

  @keyframes screenTearChaos {
    0% { transform: translate(0, 0) skew(0deg); filter: hue-rotate(0deg); }
    25% { transform: translate(-8px, 4px) skew(5deg); filter: contrast(250%) saturate(200%); }
    50% { transform: translate(8px, -4px) skew(-8deg); filter: blur(2px); }
    75% { transform: translate(-4px, -6px) skew(3deg); filter: contrast(200%); }
    100% { transform: translate(0, 0) skew(0deg); filter: none; }
  }

  .screen-dropout {
    animation: dropoutAnim 0.8s cubic-bezier(0.77, 0, 0.175, 1) forwards;
  }

  @keyframes dropoutAnim {
    0% { filter: brightness(1); transform: scale(1); }
    30% { filter: brightness(5) contrast(300%) invert(40%); transform: scale(1.05) skew(30deg, 5deg); opacity: 0.2; }
    35% { background-color: #000; opacity: 0; filter: blur(10px); }
    50% { background-color: var(--radio-red); opacity: 0.9; transform: scale(0.95); }
    60% { background-color: #000; opacity: 0.1; filter: blur(5px); }
    80% { background-color: #0d0102; opacity: 0.8; filter: brightness(0.5); }
    100% { background-color: #0d0102; opacity: 1; transform: scale(1); filter: none; }
  }

  /* ==========================================
     شاشة النهاية: شاشة سوداء مع انقطاعات بث وتلف مستمر
     ========================================== */
  #final-screen {
    display: none;
    position: fixed;
    top: 0; left: 0; width: 100vw; height: 100vh;
    background-color: #000;
    z-index: 200;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    animation: finalScreenFlicker 0.1s infinite;
  }

  /* تأثير خطوط التلف والوميض العنيف للشاشة السوداء */
  @keyframes finalScreenFlicker {
    0% { opacity: 1; background-color: #000; transform: translate(0, 0); }
    20% { opacity: 0.8; background-color: #050001; transform: translate(-2px, 1px); }
    40% { opacity: 0.95; background-color: #000; transform: translate(3px, -1px); filter: contrast(300%); }
    60% { opacity: 0.4; background-color: #1a0003; transform: translate(-1px, -2px); }
    80% { opacity: 0.9; background-color: #000; transform: translate(2px, 2px); }
    100% { opacity: 1; background-color: #000; transform: translate(0, 0); }
  }

  /* خط تفكك الإشارة المتحرك (Scanline & Glitch Bar) */
  #final-screen::before {
    content: "";
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: linear-gradient(
      rgba(255, 0, 51, 0) 0%,
      rgba(255, 0, 51, 0.2) 50%,
      rgba(0, 255, 64, 0.1) 51%,
      rgba(0, 0, 0, 0) 100%
    );
    background-size: 100% 8px;
    pointer-events: none;
    animation: scanlineMove 0.3s linear infinite;
  }

  @keyframes scanlineMove {
    0% { background-position: 0 0; }
    100% { background-position: 0 30px; }
  }

  /* ومضات انقطاع أفقية فجائية كأن البث يتقطع تماماً */
  #final-screen::after {
    content: "";
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(255, 255, 255, 0.03);
    opacity: 0;
    pointer-events: none;
    animation: suddenTear 2s steps(2, end) infinite;
  }

  @keyframes suddenTear {
    0%, 90%, 100% { opacity: 0; transform: scaleY(1); }
    92% { opacity: 0.6; transform: scaleY(0.9) skewX(20deg); filter: invert(1); }
    94% { opacity: 0.1; transform: scaleY(1.1); }
    96% { opacity: 0.8; transform: scaleY(0.5) skewX(-30deg); }
  }

  #audio-prompt {
    position: fixed;
    bottom: 10px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0, 0, 0, 0.8);
    color: var(--alastor-green);
    border: 1px solid var(--alastor-green);
    padding: 8px 15px;
    font-size: 0.7rem;
    z-index: 300;
    letter-spacing: 1px;
    animation: alertPulse 1s infinite;
    cursor: pointer;
  }
</style>
</head>
<body>

<div class="crt-overlay"></div>

<div id="audio-prompt">[ اضغط في أي مكان لتفعيل بث الراديو والزنين ZZZZZ ]</div>

<audio id="bg-static-audio" loop>
  <source src="https://www.myinstants.com/media/sounds/radio-static.mp3" type="audio/mpeg">
</audio>

<audio id="jumpscare-audio">
  <source src="https://www.myinstants.com/media/sounds/evil-laugh.mp3" type="audio/mpeg">
</audio>

<div class="main-ui" id="main-ui">
  <div class="ui-corner-tl"></div>
  <div class="ui-corner-br"></div>
  
  <div class="hex-bg" id="hex-bg"></div>

  <div class="header-grid">
    <div>STATION: 666.9 MHz - HAZBIN</div>
    <div>STATUS: RADIO_WAVE_ACTIVE</div>
  </div>

  <div class="alert-box">
    <div class="alert-title">HAZBIN FREQUENCY HIJACKED</div>
    <div class="alert-sub">LIVE FROM HELL'S BROADCAST TOWER</div>
  </div>

  <div class="hacker-brand">ALASTOR THE RADIO DEMON</div>

  <div class="progress-section">
    <div class="progress-header">
      <span id="target-ip">SOUL_FREQ: 192.666.##.##</span>
      <span id="pct-text" style="color: var(--radio-red); font-weight: bold;">0.00%</span>
    </div>
    <div class="progress-track">
      <div class="progress-fill" id="progress-bar"></div>
    </div>
  </div>

  <div class="terminal-box" id="terminal"></div>
</div>

<!-- شاشة سوداء فارغة مع آثار تقطعات وتلف البث بالكامل -->
<div id="final-screen"></div>

<script>
  const terminal = document.getElementById('terminal');
  const progressBar = document.getElementById('progress-bar');
  const pctText = document.getElementById('pct-text');
  const mainUI = document.getElementById('main-ui');
  const hexBg = document.getElementById('hex-bg');
  const targetIp = document.getElementById('target-ip');
  
  const bgStaticAudio = document.getElementById('bg-static-audio');
  const jumpscareAudio = document.getElementById('jumpscare-audio');
  const audioPrompt = document.getElementById('audio-prompt');

  window.addEventListener('click', () => {
    if (bgStaticAudio.paused) {
      bgStaticAudio.volume = 0.5;
      bgStaticAudio.play().catch(e => console.log("Audio play blocked"));
      if (audioPrompt) audioPrompt.style.display = 'none';
    }
  }, { once: true });

  let progress = 0;

  function updateHexBg() {
    let hexString = "";
    for(let i=0; i<400; i++) {
      hexString += Math.floor(Math.random()*16).toString(16).toUpperCase() + (Math.random() > 0.8 ? " ♪ " : " ");
    }
    hexBg.innerText = hexString;
  }
  setInterval(updateHexBg, 120);

  targetIp.innerText = `SOUL_FREQ: 192.666.${Math.floor(Math.random()*255)}.${Math.floor(Math.random()*255)}`;

  const logsList = [
    { text: "TUNING INTO THE PENTAGRAM BROADCAST...", type: "red" },
    { text: "ESTABLISHING STATIC INTERFERENCE [FREQ 666Hz] ZZZZZ...", type: "green" },
    { text: "LAUGHTER DETECTED: HA-HA-HA!", type: "red" },
    { text: "BROADCASTING OVER HELL'S AIRWAVES...", type: "green" },
    { text: "SUMMONING TENTACLES FROM THE SHADOWS...", type: "normal" },
    { text: "PSYCHOTIC SMILE INTENSITY: 100%", type: "red" },
    { text: "DEALING WITH SOUL CONTRACTS...", type: "green" },
    { text: "PLAYING 1930s JAZZ RECORD...", type: "normal" },
    { text: "TEARING APART OVERLORD TERRITORIES...", type: "red" },
    { text: "A SMILE IS NEVER FULLY DRESSED WITHOUT A VICTIM!", type: "green" }
  ];

  function getTimestamp() {
    const now = new Date();
    return `${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}:${now.getSeconds().toString().padStart(2,'0')}.${Math.floor(Math.random()*999).toString().padStart(3,'0')}`;
  }

  function addLog() {
    if (progress >= 100) return;

    const row = document.createElement('div');
    row.className = 'log-row';

    const timeSpan = document.createElement('span');
    timeSpan.className = 'log-time';
    timeSpan.innerText = getTimestamp();

    const msgSpan = document.createElement('span');
    
    if (Math.random() > 0.4) {
      const logItem = logsList[Math.floor(Math.random() * logsList.length)];
      msgSpan.className = `log-msg ${logItem.type === 'normal' ? '' : logItem.type}`;
      msgSpan.innerText = `♪ ${logItem.text}`;
    } else {
      msgSpan.className = 'log-msg';
      msgSpan.style.color = '#ff4444';
      msgSpan.innerText = `[RADIO_STATIC_ZZZZZ] // SIGNAL_BURST_666`;
    }

    row.appendChild(timeSpan);
    row.appendChild(msgSpan);
    terminal.appendChild(row);

    if (terminal.childNodes.length > 20) {
      terminal.removeChild(terminal.firstChild);
    }
    terminal.scrollTop = terminal.scrollHeight;

    if (Math.random() > 0.8) {
      mainUI.classList.add('severe-glitch');
      setTimeout(() => mainUI.classList.remove('severe-glitch'), 250);
    }

    setTimeout(addLog, Math.random() * 120 + 40);
  }

  function updateProgress() {
    if (progress < 100) {
      progress += Math.random() * 0.9; 
      if (progress > 100) progress = 100;
      
      progressBar.style.width = `${progress}%`;
      pctText.innerText = `${progress.toFixed(2)}%`;

      if (progress > 80) {
        mainUI.classList.add('severe-glitch');
      }

      setTimeout(updateProgress, Math.random() * 90 + 20);
    } else {
      triggerDropoutSequence();
    }
  }

  function triggerDropoutSequence() {
    mainUI.classList.add('screen-dropout');
    
    bgStaticAudio.pause();
    jumpscareAudio.volume = 0.9;
    jumpscareAudio.play().catch(e => console.log("Final audio blocked"));
    
    setTimeout(() => {
      mainUI.style.display = 'none';
      document.getElementById('final-screen').style.display = 'flex';
    }, 750);
  }

  setTimeout(() => {
    addLog();
    updateProgress();
  }, 800);

</script>
</body>
</html>
