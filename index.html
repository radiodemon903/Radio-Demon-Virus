<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RADIO_BROADCAST // ALASTOR</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');

  :root {
    --bg-color: #0d0102;
    --radio-red: #ff0033;
    --dark-red: #4a000d;
    --alastor-green: #00ff40; 
    --text-dim: #8c4a4a;
  }

  body, html {
    margin: 0; padding: 0; background-color: #000; color: var(--radio-red);
    font-family: 'Share Tech Mono', monospace; height: 100vh; overflow: hidden; user-select: none;
  }

  /* حاوية الشاشة بأكملها لتطبيق تأثير الانطفاء عليها */
  #screen-container {
    width: 100vw; height: 100vh; background-color: var(--bg-color);
    position: relative; overflow: hidden; transform-origin: center center;
  }

  #start-screen {
    position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background-color: #000;
    color: var(--alastor-green); display: flex; justify-content: center; align-items: center;
    font-size: 1.5rem; z-index: 1000; cursor: pointer; text-shadow: 0 0 15px var(--alastor-green);
    animation: alertPulse 1s infinite;
  }

  .crt-overlay {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.7) 50%);
    background-size: 100% 3px; z-index: 100; pointer-events: none;
    box-shadow: inset 0 0 140px rgba(0,0,0,0.95); animation: flicker 0.08s infinite;
  }

  @keyframes flicker {
    0% { opacity: 0.9; } 50% { opacity: 1; } 100% { opacity: 0.85; }
  }

  .main-ui {
    position: relative; width: 96%; max-width: 600px; height: 96vh;
    margin: 2vh auto; padding: 20px; box-sizing: border-box; display: none; flex-direction: column; z-index: 10;
  }

  .main-ui::before, .main-ui::after, .ui-corner-tl, .ui-corner-br {
    border-color: var(--alastor-green); border-style: solid; border-width: 2px; position: absolute;
  }
  .main-ui::before { content:''; top: 0; left: 0; width: 100%; height: 100%; border-right: none; border-bottom: none; pointer-events:none;}
  .main-ui::after { content:''; bottom: 0; right: 0; width: 100%; height: 100%; border-left: none; border-top: none; pointer-events:none;}
  .ui-corner-tl { top: 0; right: 0; width: 30px; height: 30px; border-left: none; border-bottom: none; }
  .ui-corner-br { bottom: 0; left: 0; width: 30px; height: 30px; border-right: none; border-top: none; }

  .hex-bg {
    position: absolute; top: 50px; left: 0; width: 100%; height: 80%; font-size: 0.55rem;
    color: rgba(0, 255, 64, 0.05); word-break: break-all; overflow: hidden; z-index: -1; line-height: 1;
  }

  .header-grid { display: grid; grid-template-columns: 1fr 1fr; border-bottom: 1px solid var(--dark-red); padding-bottom: 10px; font-size: 0.75rem; color: var(--text-dim); margin-bottom: 20px; }
  .header-grid div:nth-child(2) { text-align: right; }

  .alert-box { border: 1px solid var(--alastor-green); background: rgba(0, 255, 64, 0.08); padding: 10px; text-align: center; margin-bottom: 15px; }
  .alert-title { color: var(--alastor-green); font-size: 1.4rem; font-weight: bold; letter-spacing: 3px; text-shadow: 0 0 10px var(--alastor-green); animation: alertPulse 0.5s infinite; }
  @keyframes alertPulse { 0%, 100% { opacity: 1; text-shadow: 0 0 15px var(--alastor-green); } 50% { opacity: 0.4; text-shadow: none; } }

  .hacker-brand { text-align: center; font-size: 1.7rem; color: var(--radio-red); text-shadow: 0 0 15px var(--radio-red), 0 0 30px #000; margin: 20px 0; animation: brandGlitch 1.5s infinite; font-weight: bold; letter-spacing: 2px; }
  @keyframes brandGlitch { 0% { transform: skew(0deg); } 10% { transform: skew(-15deg); filter: blur(1px); } 12% { transform: skew(10deg); filter: none; } 100% { transform: skew(0deg); } }

  .progress-section { margin-bottom: 20px; }
  .progress-header { display: flex; justify-content: space-between; font-size: 0.8rem; margin-bottom: 5px; color: #ccc; }
  .progress-track { width: 100%; height: 12px; border: 1px solid var(--text-dim); background: #000; position: relative; }
  .progress-fill { height: 100%; background: var(--radio-red); width: 0%; box-shadow: 0 0 15px var(--radio-red); transition: width 0.1s; }

  .terminal-box { flex-grow: 1; border: 1px solid var(--dark-red); background: rgba(40, 0, 10, 0.3); padding: 10px; overflow: hidden; font-size: 0.75rem; line-height: 1.5; }
  .log-row { display: flex; margin-bottom: 3px; }
  .log-time { color: var(--text-dim); margin-right: 10px; width: 65px; }
  .log-msg { color: #fff; flex-grow: 1; word-break: break-all; }
  .log-msg.green { color: var(--alastor-green); text-shadow: 0 0 5px var(--alastor-green); }
  .log-msg.red { color: var(--radio-red); }

  .severe-glitch { animation: screenTearChaos 0.12s infinite; }
  @keyframes screenTearChaos { 0% { transform: translate(0, 0) skew(0deg); filter: hue-rotate(0deg); } 25% { transform: translate(-8px, 4px) skew(5deg); filter: contrast(250%) saturate(200%); } 50% { transform: translate(8px, -4px) skew(-8deg); filter: blur(2px); } 75% { transform: translate(-4px, -6px) skew(3deg); filter: contrast(200%); } 100% { transform: translate(0, 0) skew(0deg); filter: none; } }

  /* تأثير إغلاق الشاشة الواقعي (تلفاز قديم) */
  .crt-shut-off {
    animation: turn-off 0.55s cubic-bezier(0.23, 1, 0.32, 1) forwards;
  }
  @keyframes turn-off {
    0% { transform: scale(1, 1.3) translate3d(0, 0, 0); filter: brightness(1); }
    60% { transform: scale(1, 0.001) translate3d(0, 0, 0); filter: brightness(10); }
    100% { transform: scale(0, 0.001) translate3d(0, 0, 0); filter: brightness(0); opacity: 0; }
  }
</style>
</head>
<body>

<div id="start-screen">[ اضغط للاتصال بتردد الراديو ]</div>

<!-- ملف صوت ألاستور -->
<audio id="audio-alastor-quote">
  <source src="alastor-if-i-had-to-hurt-anyone-here.mp3" type="audio/mpeg">
</audio>

<div id="screen-container">
  <div class="crt-overlay"></div>
  
  <div class="main-ui" id="main-ui">
    <div class="ui-corner-tl"></div>
    <div class="ui-corner-br"></div>
    <div class="hex-bg" id="hex-bg"></div>
    <div class="header-grid">
      <div>STATION: 666.9 MHz - HAZBIN</div>
      <div>STATUS: RADIO_WAVE_ACTIVE</div>
    </div>
    <div class="alert-box"><div class="alert-title">HAZBIN FREQUENCY HIJACKED</div></div>
    <div class="hacker-brand">ALASTOR THE RADIO DEMON</div>
    <div class="progress-section">
      <div class="progress-header"><span id="target-ip">SOUL_FREQ: 192.666.##.##</span><span id="pct-text" style="color: var(--radio-red); font-weight: bold;">0.00%</span></div>
      <div class="progress-track"><div class="progress-fill" id="progress-bar"></div></div>
    </div>
    <div class="terminal-box" id="terminal"></div>
  </div>
</div>

<script>
  // -- هندسة صوتية جديدة: جليتش رقمي واقعي وتلف الشاشة --
  let audioCtx, staticGainNode;

  function initAudio() {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }

  function startBackgroundStatic() {
    let bufferSize = audioCtx.sampleRate * 2;
    let buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    let data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
    let noise = audioCtx.createBufferSource();
    noise.buffer = buffer;
    noise.loop = true;
    let filter = audioCtx.createBiquadFilter();
    filter.type = 'lowpass'; filter.frequency.value = 1500; // صوت أعمق وأكثر كآبة
    staticGainNode = audioCtx.createGain();
    staticGainNode.gain.value = 0.05;
    noise.connect(filter).connect(staticGainNode).connect(audioCtx.destination);
    noise.start();
  }

  function playDigitalGlitchSound() {
    if (!audioCtx) return;
    
    // استخدام موجة "مربعة" لإعطاء صوت Error/Bug رقمي خشن
    let osc = audioCtx.createOscillator();
    osc.type = 'square';
    
    // تردد ينخفض بسرعة شديدة ليعطي تأثير "Bzzzt"
    osc.frequency.setValueAtTime(Math.random() * 800 + 300, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.1);
    
    let gain = audioCtx.createGain();
    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
    gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.15);
    
    osc.connect(gain).connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.15);
  }

  function startSmoothBeep() {
    if (staticGainNode) staticGainNode.gain.value = 0; // إطفاء التشويش الخلفي
    let osc = audioCtx.createOscillator();
    osc.type = 'sine';
    osc.frequency.value = 800; // تردد التلفاز الفاصل Teeeeet
    let gain = audioCtx.createGain();
    gain.gain.value = 0.12;
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(); 
  }
  // -------------------------------------------------------------

  const startScreen = document.getElementById('start-screen');
  const mainUI = document.getElementById('main-ui');
  const terminal = document.getElementById('terminal');
  const progressBar = document.getElementById('progress-bar');
  const pctText = document.getElementById('pct-text');
  const audioAlastorQuote = document.getElementById('audio-alastor-quote');
  const screenContainer = document.getElementById('screen-container');

  let progress = 0;
  let sequenceStarted = false;

  startScreen.addEventListener('click', () => {
    if (sequenceStarted) return;
    sequenceStarted = true;
    
    initAudio();
    startBackgroundStatic();

    startScreen.style.display = 'none';
    mainUI.style.display = 'flex';
    
    setTimeout(() => {
      addLog();
      updateProgress();
    }, 500);
  });

  const logsList = [
    { text: "TUNING INTO THE PENTAGRAM BROADCAST...", type: "red" },
    { text: "ESTABLISHING STATIC INTERFERENCE [FREQ 666Hz] ZZZZZ...", type: "green" },
    { text: "IF I WANTED TO HURT ANYONE HERE...", type: "red" },
    { text: "BROADCASTING OVER HELL'S AIRWAVES...", type: "green" },
    { text: "PSYCHOTIC SMILE INTENSITY: 100%", type: "red" },
    { text: "I WOULD HAVE DONE SO ALREADY!", type: "green" }
  ];

  function getTimestamp() {
    const now = new Date();
    return `${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}:${now.getSeconds().toString().padStart(2,'0')}.${Math.floor(Math.random()*999).toString().padStart(3,'0')}`;
  }

  function addLog() {
    if (progress >= 100) return;

    const row = document.createElement('div');
    row.className = 'log-row';
    const timeSpan = document.createElement('span');
    timeSpan.className = 'log-time';
    timeSpan.innerText = getTimestamp();

    const msgSpan = document.createElement('span');
    if (Math.random() > 0.4) {
      const logItem = logsList[Math.floor(Math.random() * logsList.length)];
      msgSpan.className = `log-msg ${logItem.type}`;
      msgSpan.innerText = `♪ ${logItem.text}`;
    } else {
      msgSpan.className = 'log-msg';
      msgSpan.style.color = '#ff4444';
      msgSpan.innerText = `[ERROR_BZZT] // SIGNAL_CORRUPTED_666`;
    }

    row.appendChild(timeSpan);
    row.appendChild(msgSpan);
    terminal.appendChild(row);
    terminal.scrollTop = terminal.scrollHeight;

    // تفعيل الجليتش البصري مع الصوت الرقمي الجديد
    if (Math.random() > 0.7) {
      mainUI.classList.add('severe-glitch');
      playDigitalGlitchSound(); 
      setTimeout(() => mainUI.classList.remove('severe-glitch'), 150);
    }

    setTimeout(addLog, Math.random() * 150 + 50);
  }

  function updateProgress() {
    if (progress < 100) {
      progress += Math.random() * 0.9; 
      if (progress > 100) progress = 100;
      
      progressBar.style.width = `${progress}%`;
      pctText.innerText = `${progress.toFixed(2)}%`;

      setTimeout(updateProgress, Math.random() * 100 + 30);
    } else {
      triggerEndSequence();
    }
  }

  function triggerEndSequence() {
    // 1. جنون الشاشة لثانية قبل الانطفاء
    mainUI.classList.add('severe-glitch');
    playDigitalGlitchSound();
    
    setTimeout(() => {
      // 2. تفعيل تأثير انطفاء التلفاز الكلاسيكي على الحاوية بأكملها
      mainUI.classList.remove('severe-glitch');
      screenContainer.classList.add('crt-shut-off');
      
      // 3. تشغيل الصفير المستمر 
      startSmoothBeep();

      // 4. تشغيل صوت ألاستور في الظلام بعد ثانية تقريباً من انطفاء الشاشة
      setTimeout(() => {
        audioAlastorQuote.volume = 1.0;
        audioAlastorQuote.play().catch(e => console.log("الصوت لم يعمل"));
      }, 800);
      
    }, 400); // الشاشة تجن لمدة 0.4 ثانية ثم تنطفئ
  }
</script>
</body>
</html>
