<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BROADCAST OVERRIDE</title>
    <style>
        :root {
            --alastor-red: #990000;
            --alastor-bright: #ff1a1a;
            --bg-dark: #0a0002;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-dark);
            color: var(--alastor-bright);
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            user-select: none;
        }

        /* Start Screen Overlay */
        #start-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            cursor: pointer;
        }

        #start-btn {
            border: 2px solid var(--alastor-red);
            padding: 20px 40px;
            font-size: 1.5rem;
            color: var(--alastor-bright);
            text-shadow: 0 0 10px var(--alastor-red);
            box-shadow: 0 0 15px var(--alastor-red);
            transition: all 0.3s;
        }

        #start-btn:hover {
            background-color: var(--alastor-red);
            color: #000;
        }

        /* Main Container */
        #main-frame {
            width: 80%;
            max-width: 900px;
            border: 2px solid var(--alastor-red);
            padding: 30px;
            box-shadow: 0 0 25px rgba(153, 0, 0, 0.6);
            background: rgba(10, 0, 2, 0.9);
            position: relative;
        }

        /* CRT Scanline Effect */
        #main-frame::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
            background-size: 100% 4px;
            z-index: 10;
            pointer-events: none;
        }

        h1 {
            text-align: center;
            font-size: 2.2rem;
            margin-top: 0;
            letter-spacing: 3px;
            text-shadow: 2px 2px 8px var(--alastor-red);
        }

        .status-title {
            text-align: center;
            font-size: 1.2rem;
            color: #ffffff;
            margin-bottom: 20px;
            animation: blink 1s infinite;
        }

        /* Progress Bar */
        .progress-container {
            width: 100%;
            background-color: #1a0003;
            border: 1px solid var(--alastor-red);
            height: 30px;
            margin-bottom: 10px;
            position: relative;
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background-color: var(--alastor-red);
            box-shadow: 0 0 15px var(--alastor-bright);
            transition: width 0.1s linear;
        }

        .percentage-text {
            text-align: right;
            font-size: 1.1rem;
            margin-bottom: 20px;
        }

        /* Terminal Logs */
        .terminal {
            height: 200px;
            background-color: #000;
            border: 1px solid #330000;
            padding: 10px;
            overflow: hidden;
            font-size: 0.85rem;
            color: #cc3333;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
        }

        .log-line {
            margin: 2px 0;
            white-space: nowrap;
        }

        /* Glitch Animation */
        .glitch {
            animation: glitch-anim 0.2s infinite alternate;
        }

        @keyframes glitch-anim {
            0% { transform: translate(0) }
            20% { transform: translate(-3px, 3px) }
            40% { transform: translate(-3px, -3px) }
            60% { transform: translate(3px, 3px) }
            80% { transform: translate(3px, -3px) }
            100% { transform: translate(0) }
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        /* Final Collapse Effect */
        .tv-off {
            animation: collapse-screen 0.6s forwards ease-in;
        }

        @keyframes collapse-screen {
            0% {
                transform: scale(1, 1);
                filter: brightness(2);
            }
            50% {
                transform: scale(1, 0.005);
                filter: brightness(5);
            }
            100% {
                transform: scale(0, 0);
                filter: brightness(0);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <div id="start-overlay">
        <div id="start-btn">TUNE IN</div>
    </div>

    <div id="main-frame">
        <h1>ALASTOR'S BROADCAST</h1>
        <div class="status-title">DOWNLOADING RADIO VIRUS...</div>
        
        <div class="progress-container">
            <div class="progress-bar" id="progress-bar"></div>
        </div>
        <div class="percentage-text" id="percent-text">0%</div>

        <div class="terminal" id="terminal"></div>
    </div>

    <script>
        const overlay = document.getElementById('start-overlay');
        const progressBar = document.getElementById('progress-bar');
        const percentText = document.getElementById('percent-text');
        const terminal = document.getElementById('terminal');
        const mainFrame = document.getElementById('main-frame');

        // Simulated terminal commands and visual code snippets
        const mockLogs = [
            "import os, sys, socket, ssl",
            "INITIALIZING FREQUENCY OVERRIDE...",
            "CONNECTING TO VOXTEK_NET_GATEWAY...",
            "bypass_firewall(protocol='voodoo', port=666)",
            "Extracting system architecture...",
            "TARGET_IP: 192.168.1." + Math.floor(Math.random() * 254),
            "def harvest_credentials(user_session):",
            "    data = memory_dump(0x0000FF)",
            "    return encrypt_radio(data)",
            "INJECTING RADIO_DEMON_CORE_PAYLOAD...",
            "Accessing audio input channels...",
            "BROADCAST SIGNAL ESTABLISHED.",
            "Cracking encryption keys...",
            "SYS_OVERRIDE: Complete control granted.",
            "STAY TUNED...",
            "FINALIZING TRANSMISSION..."
        ];

        let progress = 0;
        let logIndex = 0;

        overlay.addEventListener('click', () => {
            overlay.style.display = 'none';
            
            // Request full screen mode for realism
            if (document.documentElement.requestFullscreen) {
                document.documentElement.requestFullscreen().catch(() => {});
            }
            
            startPrank();
        });

        function startPrank() {
            // Random glitch trigger
            setInterval(() => {
                if (Math.random() > 0.7) {
                    mainFrame.classList.add('glitch');
                    setTimeout(() => mainFrame.classList.remove('glitch'), 150);
                }
            }, 500);

            // Progress bar and log loop
            const interval = setInterval(() => {
                progress += Math.floor(Math.random() * 3) + 1;

                if (progress > 100) progress = 100;

                progressBar.style.width = progress + '%';
                percentText.innerText = progress + '%';

                // Add log lines matching progress speed
                if (logIndex < mockLogs.length && Math.random() > 0.4) {
                    const line = document.createElement('div');
                    line.className = 'log-line';
                    line.innerText = "> " + mockLogs[logIndex];
                    terminal.appendChild(line);
                    logIndex++;
                }

                // Final breakdown sequence
                if (progress >= 100) {
                    clearInterval(interval);
                    setTimeout(triggerCollapse, 1000);
                }
            }, 120);
        }

        function triggerCollapse() {
            mainFrame.classList.add('tv-off');
            setTimeout(() => {
                document.body.style.backgroundColor = '#000000';
            }, 600);
        }
    </script>
</body>
</html>
