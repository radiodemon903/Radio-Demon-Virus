<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RADIO_BROADCAST // ALASTOR - NO SIGNAL</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Permanent+Marker&display=swap');

  :root {
    --bg-color: #020000;
    --radio-red: #ff0011;
    --dark-red: #3a0005;
    --alastor-green: #33ff00;
    --text-dim: #882222;
    --glitch-cyan: #00ffff;
    --glitch-magenta: #ff00ff;
    --glitch-yellow: #ffff00;
  }

  body, html {
    margin: 0; padding: 0; background-color: #000; color: var(--radio-red);
    font-family: 'Share Tech Mono', monospace; height: 100vh; overflow: hidden; user-select: none;
  }

  /* شاشة الترحيب */
  #splash-screen {
    position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; 
    background: radial-gradient(circle, #150000 0%, #000000 100%);
    z-index: 9999; display: flex; justify-content: center; align-items: center;
    padding: 15px; box-sizing: border-box;
  }

  .splash-card {
    border: 2px solid var(--radio-red); background: rgba(5, 0, 0, 0.95);
    width: 100%; max-width: 480px; padding: 25px; box-sizing: border-box;
    position: relative; box-shadow: 0 0 50px rgba(255, 0, 17, 0.4), inset 0 0 20px rgba(255, 0, 17, 0.2);
    animation: cardFlicker 3s infinite;
  }

  .splash-brand-title {
    text-align: center; font-size: 2rem; color: var(--radio-red); font-weight: bold;
    letter-spacing: 5px; text-shadow: 0 0 15px var(--radio-red), 2px 2px 0px #000; margin-bottom: 5px;
  }

  .splash-action-btn {
    background: var(--dark-red); color: var(--alastor-green); border: 1px solid var(--alastor-green);
    padding: 14px; font-family: 'Share Tech Mono', monospace; font-size: 1rem; font-weight: bold;
    letter-spacing: 2px; cursor: pointer; width: 100%; transition: all 0.2s ease;
    box-shadow: 0 0 15px rgba(51, 255, 0, 0.3); text-align: center; margin-top: 20px;
  }

  .splash-action-btn:hover { background: var(--alastor-green); color: #000; box-shadow: 0 0 30px var(--alastor-green); }

  @keyframes cardFlicker { 0%, 100% { border-color: var(--radio-red); box-shadow: 0 0 40px rgba(255, 0, 17, 0.4); } 50% { border-color: #400; box-shadow: 0 0 10px rgba(255, 0, 17, 0.1); } }

  #screen-container {
    width: 100vw; height: 100vh; background-color: var(--bg-color);
    position: relative; overflow: hidden; transform-origin: center center;
    opacity: 0; transition: opacity 0.5s ease;
  }

  /* خطوط الشاشة والتشويش الأساسي */
  .crt-overlay {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: 
      linear-gradient(rgba(10, 0, 0, 0) 50%, rgba(0, 0, 0, 0.8) 50%),
      repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(255, 0, 17, 0.15) 2px, rgba(0, 0, 0, 0.2) 4px);
    background-size: 100% 4px, 100% 100%;
    z-index: 100; pointer-events: none;
    box-shadow: inset 0 0 150px rgba(0,0,0,0.95); 
    animation: digitalNoiseFlicker 0.05s infinite;
  }

  /* تشويش الألوان المتعددة (السيان والماجنتا والأصفر) مثل الصورة تماماً */
  .rgb-glitch-overlay {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background-image: 
      repeating-linear-gradient(90deg, 
        transparent 0%, transparent 15%, 
        rgba(0, 255, 255, 0.15) 16%, transparent 17%, 
        rgba(255, 0, 255, 0.15) 45%, transparent 46%,
        rgba(255, 255, 0, 0.1) 80%, transparent 81%);
    opacity: 0.6; z-index: 90; pointer-events: none; mix-blend-mode: screen;
    animation: rgbTear 0.1s steps(5) infinite;
  }

  @keyframes rgbTear {
    0% { transform: translateX(0) scaleY(1); opacity: 0.3; }
    25% { transform: translateX(-15px) scaleY(1.02); opacity: 0.8; filter: hue-rotate(90deg); }
    50% { transform: translateX(25px) scaleY(0.98); opacity: 0.5; filter: hue-rotate(180deg); }
    75% { transform: translateX(-5px) scaleY(1.05); opacity: 0.9; }
    100% { transform: translateX(0) scaleY(1); opacity: 0.4; }
  }

  .main-ui {
    position: relative; width: 96%; max-width: 800px; height: 96vh;
    margin: 2vh auto; padding: 20px; box-sizing: border-box; display: flex; flex-direction: column; z-index: 10;
  }

  /* تصميم عبارة NO SIGNAL مطابقة لخطوط الفرشاة في الصورة */
  .hacker-brand {
    font-family: 'Permanent Marker', cursive;
    text-align: center;
    font-size: 13vw;
    color: var(--radio-red);
    text-shadow: 
      0 0 15px rgba(255, 0, 17, 0.8),
      -4px 0px 0px rgba(0, 255, 255, 0.4), /* تأثير الجليتش اللوني */
      4px 0px 0px rgba(255, 0, 255, 0.4),
      5px 5px 0 #000;
    margin: auto 0;
    line-height: 1;
    letter-spacing: -2px;
    animation: brandGlitch 0.1s infinite;
    position: relative;
    z-index: 50;
  }

  /* تصميم حرف O المشطوب بنفس نمط الفرشاة */
  .crossed-o {
    position: relative;
    display: inline-block;
  }
  .crossed-o::after {
    content: '';
    position: absolute;
    top: 10%; left: -10%; width: 120%; height: 80%;
    border: 0.15em solid var(--radio-red);
    border-radius: 50%;
    box-shadow: 0 0 15px var(--radio-red), inset 0 0 10px var(--radio-red);
    clip-path: polygon(0 0, 100% 0, 100% 45%, 0 45%, 0 55%, 100% 55%, 100% 100%, 0 100%);
    transform: rotate(45deg);
  }
  .crossed-o::before {
    content: '';
    position: absolute;
    top: -5%; left: 45%; width: 0.15em; height: 110%;
    background-color: var(--radio-red);
    transform: rotate(45deg);
    box-shadow: 0 0 15px var(--radio-red);
  }

  @keyframes brandGlitch { 
    0% { transform: translate(0,0) skew(0deg); } 
    20% { transform: translate(-4px, 2px) skew(-5deg); filter: brightness(1.5); text-shadow: -5px 0 var(--glitch-cyan), 5px 0 var(--glitch-magenta); } 
    40% { transform: translate(4px, -2px) skew(5deg); filter: brightness(0.8); } 
    60% { transform: translate(-2px, -2px) skew(0deg); } 
    80% { transform: translate(3px, 2px) skew(-2deg); } 
    100% { transform: translate(0,0) skew(0deg); } 
  }

  .progress-section { margin-top: auto; margin-bottom: 15px; background: rgba(0,0,0,0.8); padding: 10px; border: 1px solid var(--dark-red); }
  .progress-header { display: flex; justify-content: space-between; font-size: 0.8rem; margin-bottom: 5px; color: #fff; font-family: 'Share Tech Mono', monospace; }
  .progress-track { width: 100%; height: 15px; background: #111; position: relative; border: 1px solid var(--radio-red); }
  .progress-fill { height: 100%; background: var(--radio-red); width: 0%; box-shadow: 0 0 15px var(--radio-red); transition: width 0.1s; }

  /* جليتش التمزيق العنيف */
  .severe-glitch { animation: severeChaos 0.05s infinite !important; }
  @keyframes severeChaos { 
    0% { transform: translate(0, 0); filter: none; } 
    25% { transform: translate(-50px, 10px) scale(1.05); filter: contrast(500%) hue-rotate(90deg) invert(10%); background-color: var(--glitch-cyan); } 
    50% { transform: translate(40px, -15px) scale(0.95); filter: blur(2px) contrast(800%) saturate(1000%); color: var(--glitch-magenta); } 
    75% { transform: translate(-20px, 5px); filter: contrast(1000%) grayscale(100%); } 
    100% { transform: translate(0, 0); filter: none; } 
  }

  /* تأثير خراب الشاشة النهائي */
  .screen-broken-effect {
    animation: screenBreak 3s forwards;
  }
  @keyframes screenBreak {
    0% { transform: skewX(0deg); filter: brightness(1); }
    10% { transform: skewX(40deg) scaleY(0.5); filter: brightness(3) invert(1); background: var(--glitch-cyan); }
    20% { transform: skewX(-40deg) scaleY(1.2); filter: brightness(5) sepia(1); background: var(--radio-red); }
    30% { transform: skewX(10deg) translateY(200px); filter: blur(10px); }
    35% { transform: scale(1, 0.01); filter: brightness(10) contrast(1000%); background-color: #fff; box-shadow: 0 0 500px #fff; }
    50% { transform: scale(0, 0); opacity: 0; }
    100% { transform: scale(0, 0); opacity: 0; background: #000; }
  }

  #pure-black-screen {
    position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
    background-color: #000; z-index: 999999; display: none; pointer-events: auto;
  }
</style>
</head>
<body>

<div id="splash-screen">
  <div class="splash-card">
    <div class="splash-brand-title">SYSTEM OVERRIDE</div>
    <button class="splash-action-btn" onclick="startExperience()">
      [ INITIALIZE CONNECTION ]
    </button>
  </div>
</div>

<div id="screen-container">
  <div class="crt-overlay"></div>
  <div class="rgb-glitch-overlay"></div>
  
  <div class="main-ui" id="main-ui">
    
    <!-- عبارة NO SIGNAL مع حرف O المشطوب -->
    <div class="hacker-brand">N<span class="crossed-o" style="color:transparent">O</span> SIGNAL</div>
    
    <div class="progress-section">
      <div class="progress-header"><span style="color: var(--radio-red);">TRANSMISSION OVERRIDDEN</span><span id="pct-text" style="color: #fff;">0.00%</span></div>
      <div class="progress-track"><div class="progress-fill" id="progress-bar"></div></div>
    </div>
    
  </div>
</div>

<div id="pure-black-screen"></div>

<script>
  let audioCtx, staticGainNode, noiseSource;
  let sequenceStarted = false;

  function initAudio() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
  }

  function startBackgroundStatic() {
    let bufferSize = audioCtx.sampleRate * 2;
    let buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    let data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
    noiseSource = audioCtx.createBufferSource();
    noiseSource.buffer = buffer;
    noiseSource.loop = true;
    let filter = audioCtx.createBiquadFilter();
    filter.type = 'highpass'; filter.frequency.value = 2000; // تشويش حاد جداً
    staticGainNode = audioCtx.createGain();
    staticGainNode.gain.value = 0.15;
    noiseSource.connect(filter).connect(staticGainNode).connect(audioCtx.destination);
    noiseSource.start();
  }

  /* صوت جليتش حاد ومزعج جداً (High Frequency) */
  function playHighFreqGlitch() {
    if (!audioCtx) return;
    let now = audioCtx.currentTime;
    
    let osc1 = audioCtx.createOscillator();
    let osc2 = audioCtx.createOscillator();
    let gainNode = audioCtx.createGain();

    osc1.type = 'square';
    osc2.type = 'sawtooth';

    // ترددات مزعجة جداً تصعد وتهبط بسرعة
    osc1.frequency.setValueAtTime(4000, now);
    osc1.frequency.exponentialRampToValueAtTime(8000, now + 0.1);
    
    osc2.frequency.setValueAtTime(6000, now);
    osc2.frequency.linearRampToValueAtTime(2000, now + 0.15);

    gainNode.gain.setValueAtTime(0.3, now);
    gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.15);

    osc1.connect(gainNode);
    osc2.connect(gainNode);
    gainNode.connect(audioCtx.destination);

    osc1.start(now); osc2.start(now);
    osc1.stop(now + 0.15); osc2.stop(now + 0.15);
  }

  /* صوت الطنين النهائي الطويل والمزعج والمتردد (Teeeeeeet) */
  function playAgonizingDeathTone() {
    if (!audioCtx) return;
    let now = audioCtx.currentTime;
    
    // استخدام موجتين بترددات قريبة جداً لخلق اهتزاز (Beating Effect) مزعج للأذن
    let osc1 = audioCtx.createOscillator();
    let osc2 = audioCtx.createOscillator();
    let gain = audioCtx.createGain();

    osc1.type = 'sawtooth';
    osc2.type = 'square';

    osc1.frequency.setValueAtTime(950, now); // تردد مرتفع
    osc2.frequency.setValueAtTime(958, now); // الفارق يخلق اهتزاز مزعج

    // يرتفع الصوت ليصبح عالياً جداً ويستمر طويلاً
    gain.gain.setValueAtTime(0, now);
    gain.gain.linearRampToValueAtTime(0.7, now + 0.2); // ارتفاع سريع للصوت
    gain.gain.setValueAtTime(0.7, now + 3.0); // يثبت لمدة 3 ثواني
    gain.gain.exponentialRampToValueAtTime(0.001, now + 4.5); // ينخفض ببطء

    osc1.connect(gain);
    osc2.connect(gain);
    gain.connect(audioCtx.destination);

    osc1.start(now); osc2.start(now);
    osc1.stop(now + 4.5); osc2.stop(now + 4.5);
  }

  const mainUI = document.getElementById('main-ui');
  const progressBar = document.getElementById('progress-bar');
  const pctText = document.getElementById('pct-text');
  const screenContainer = document.getElementById('screen-container');
  const splashScreen = document.getElementById('splash-screen');
  const pureBlackScreen = document.getElementById('pure-black-screen');

  let progress = 0;

  function startExperience() {
    if (sequenceStarted) return;
    sequenceStarted = true;
    splashScreen.style.opacity = '0';
    setTimeout(() => { splashScreen.style.display = 'none'; }, 400);
    screenContainer.style.opacity = '1';
    
    initAudio(); 
    startBackgroundStatic();
    playHighFreqGlitch(); 
    
    mainUI.classList.add('severe-glitch');
    setTimeout(() => mainUI.classList.remove('severe-glitch'), 200);
    setTimeout(updateProgress, 500);
  }

  function updateProgress() {
    if (progress < 100) {
      // سرعة التحميل متقطعة لإعطاء طابع الفوضى
      progress += Math.random() * 2; 
      if (progress > 100) progress = 100;
      
      progressBar.style.width = `${progress}%`; 
      pctText.innerText = `${progress.toFixed(2)}%`;

      // تشغيل أصوات وتأثيرات عشوائية أثناء التحميل
      if (Math.random() > 0.7) {
        playHighFreqGlitch();
        mainUI.classList.add('severe-glitch');
        setTimeout(() => mainUI.classList.remove('severe-glitch'), 100);
      }

      setTimeout(updateProgress, Math.random() * 100 + 30);
    } else {
      triggerSystemFailure();
    }
  }

  function triggerSystemFailure() {
    // إيقاف تشويش الخلفية العادي
    if (staticGainNode) staticGainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
    
    mainUI.classList.add('severe-glitch');
    
    setTimeout(() => {
      // بدء صوت الـ Teeeeet المزعج والممتد
      playAgonizingDeathTone();
      
      // تطبيق تأثير تحطم الشاشة العنيف
      screenContainer.classList.add('screen-broken-effect');
      
      // إغلاق الشاشة وجعلها سوداء تماماً بعد انتهاء التحطم والصوت
      setTimeout(() => {
        pureBlackScreen.style.display = 'block';
        if (noiseSource) noiseSource.stop();
      }, 3500);

    }, 500);
  }
</script>
</body>
</html>
