<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RADIO_BROADCAST // ALASTOR</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');

  :root {
    --bg-color: #0d0102;
    --radio-red: #ff0033;
    --dark-red: #4a000d;
    --alastor-green: #00ff40; 
    --text-dim: #8c4a4a;
  }

  body, html {
    margin: 0; padding: 0; background-color: #000; color: var(--radio-red);
    font-family: 'Share Tech Mono', monospace; height: 100vh; overflow: hidden; user-select: none;
  }

  /* شاشة ترحيب منظمة ومرعبة بأسلوب Alastor */
  #splash-screen {
    position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: radial-gradient(circle, #1a0005 0%, #050001 100%);
    z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center;
    cursor: pointer; text-align: center; padding: 20px; box-sizing: border-box;
  }
  
  .splash-box {
    border: 2px solid var(--radio-red); background: rgba(15, 0, 3, 0.9);
    padding: 35px 25px; max-width: 450px; width: 100%; position: relative;
    box-shadow: 0 0 40px rgba(255, 0, 51, 0.3), inset 0 0 20px rgba(255, 0, 51, 0.2);
    animation: boxFlicker 2s infinite;
  }

  .splash-box::before, .splash-box::after {
    content: ''; position: absolute; width: 10px; height: 10px; border-color: var(--alastor-green); border-style: solid;
  }
  .splash-box::before { top: 5px; left: 5px; border-right: none; border-bottom: none; }
  .splash-box::after { bottom: 5px; right: 5px; border-left: none; border-top: none; }

  .splash-freq {
    font-size: 0.8rem; color: var(--text-dim); letter-spacing: 3px; margin-bottom: 10px;
  }

  .splash-title {
    font-size: 1.5rem; color: var(--radio-red); margin-bottom: 15px; font-weight: bold;
    letter-spacing: 2px; text-shadow: 0 0 10px rgba(255, 0, 51, 0.7);
  }

  .splash-quote {
    font-size: 0.85rem; color: #fff; font-style: italic; margin-bottom: 25px; line-height: 1.6;
    border-left: 2px solid var(--alastor-green); padding-left: 10px; text-align: left;
  }

  .splash-btn {
    background: var(--dark-red); color: var(--alastor-green); border: 1px solid var(--alastor-green);
    padding: 12px 20px; font-family: 'Share Tech Mono', monospace; font-size: 0.95rem; font-weight: bold;
    letter-spacing: 2px; cursor: pointer; transition: all 0.2s ease;
    box-shadow: 0 0 15px rgba(0, 255, 64, 0.2); width: 100%;
  }

  .splash-btn:hover {
    background: var(--alastor-green); color: #000; box-shadow: 0 0 25px var(--alastor-green);
  }

  @keyframes boxFlicker {
    0%, 100% { border-color: var(--radio-red); }
    50% { border-color: #500; }
  }

  #screen-container {
    width: 100vw; height: 100vh; background-color: var(--bg-color);
    position: relative; overflow: hidden; transform-origin: center center;
    opacity: 0; transition: opacity 0.5s ease;
  }

  .crt-overlay {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.7) 50%);
    background-size: 100% 3px; z-index: 100; pointer-events: none;
    box-shadow: inset 0 0 140px rgba(0,0,0,0.95); animation: flicker 0.08s infinite;
  }

  @keyframes flicker {
    0% { opacity: 0.9; } 50% { opacity: 1; } 100% { opacity: 0.85; }
  }

  .main-ui {
    position: relative; width: 96%; max-width: 600px; height: 96vh;
    margin: 2vh auto; padding: 20px; box-sizing: border-box; display: flex; flex-direction: column; z-index: 10;
  }

  .main-ui::before, .main-ui::after, .ui-corner-tl, .ui-corner-br {
    border-color: var(--alastor-green); border-style: solid; border-width: 2px; position: absolute;
  }
  .main-ui::before { content:''; top: 0; left: 0; width: 100%; height: 100%; border-right: none; border-bottom: none; pointer-events:none;}
  .main-ui::after { content:''; bottom: 0; right: 0; width: 100%; height: 100%; border-left: none; border-top: none; pointer-events:none;}
  .ui-corner-tl { top: 0; right: 0; width: 30px; height: 30px; border-left: none; border-bottom: none; }
  .ui-corner-br { bottom: 0; left: 0; width: 30px; height: 30px; border-right: none; border-top: none; }

  .hex-bg {
    position: absolute; top: 50px; left: 0; width: 100%; height: 80%; font-size: 0.55rem;
    color: rgba(0, 255, 64, 0.05); word-break: break-all; overflow: hidden; z-index: -1; line-height: 1;
  }

  .header-grid { display: grid; grid-template-columns: 1fr 1fr; border-bottom: 1px solid var(--dark-red); padding-bottom: 10px; font-size: 0.75rem; color: var(--text-dim); margin-bottom: 20px; }
  .header-grid div:nth-child(2) { text-align: right; }

  .alert-box { border: 1px solid var(--alastor-green); background: rgba(0, 255, 64, 0.08); padding: 10px; text-align: center; margin-bottom: 15px; }
  .alert-title { color: var(--alastor-green); font-size: 1.4rem; font-weight: bold; letter-spacing: 3px; text-shadow: 0 0 10px var(--alastor-green); animation: alertPulse 0.5s infinite; }
  @keyframes alertPulse { 0%, 100% { opacity: 1; text-shadow: 0 0 15px var(--alastor-green); } 50% { opacity: 0.4; text-shadow: none; } }

  .hacker-brand { text-align: center; font-size: 1.7rem; color: var(--radio-red); text-shadow: 0 0 15px var(--radio-red), 0 0 30px #000; margin: 20px 0; animation: brandGlitch 1.5s infinite; font-weight: bold; letter-spacing: 2px; }
  @keyframes brandGlitch { 0% { transform: skew(0deg); } 10% { transform: skew(-15deg); filter: blur(1px); } 12% { transform: skew(10deg); filter: none; } 100% { transform: skew(0deg); } }

  .progress-section { margin-bottom: 20px; }
  .progress-header { display: flex; justify-content: space-between; font-size: 0.8rem; margin-bottom: 5px; color: #ccc; }
  .progress-track { width: 100%; height: 12px; border: 1px solid var(--text-dim); background: #000; position: relative; }
  .progress-fill { height: 100%; background: var(--radio-red); width: 0%; box-shadow: 0 0 15px var(--radio-red); transition: width 0.1s; }

  .terminal-box { flex-grow: 1; border: 1px solid var(--dark-red); background: rgba(40, 0, 10, 0.3); padding: 10px; overflow: hidden; font-size: 0.75rem; line-height: 1.5; }
  .log-row { display: flex; margin-bottom: 3px; }
  .log-time { color: var(--text-dim); margin-right: 10px; width: 65px; }
  .log-msg { color: #fff; flex-grow: 1; word-break: break-all; }
  .log-msg.green { color: var(--alastor-green); text-shadow: 0 0 5px var(--alastor-green); }
  .log-msg.red { color: var(--radio-red); }

  .severe-glitch { animation: screenTearChaos 0.05s infinite; }
  @keyframes screenTearChaos { 
    0% { transform: translate(0, 0) skew(0deg); filter: hue-rotate(0deg) contrast(300%); } 
    20% { transform: translate(-20px, 12px) skew(30deg); filter: contrast(600%) invert(25%); } 
    40% { transform: translate(18px, -15px) skew(-35deg); filter: blur(4px) saturate(600%); } 
    60% { transform: translate(-12px, -8px) skew(20deg); filter: contrast(700%); } 
    80% { transform: translate(10px, 10px) skew(-20deg); filter: hue-rotate(180deg); }
    100% { transform: translate(0, 0) skew(0deg); filter: none; } 
  }

  /* النهاية التدميرية: شاشة مليئة بالتشويش البصري والنقاط والخطوط الحمراء المرعبة المبتلة والمتلاشية */
  .crt-shut-off {
    animation: turn-off 0.6s cubic-bezier(0.23, 1, 0.32, 1) forwards;
  }
  @keyframes turn-off {
    0% { transform: scale(1, 1); filter: brightness(1) contrast(1); }
    30% { transform: scale(1.15, 0.01); filter: brightness(40) contrast(600%); background-color: #ff0033; }
    60% { transform: scale(0.01, 0.002); filter: brightness(50); background-color: #ff0033; box-shadow: 0 0 100px #ff0033; }
    100% { 
      transform: scale(0, 0); 
      filter: brightness(0); 
      opacity: 1; 
      background-color: #020000 !important;
      background-image: 
        radial-gradient(circle, rgba(255, 0, 51, 0.9) 3px, transparent 4px),
        radial-gradient(circle, rgba(120, 0, 20, 0.6) 2px, transparent 3px),
        linear-gradient(rgba(255, 0, 51, 0.35) 2px, transparent 2px),
        linear-gradient(90deg, rgba(255, 0, 51, 0.25) 2px, transparent 2px);
      background-size: 16px 16px, 8px 8px, 24px 24px, 24px 24px;
      background-position: 0 0, 4px 4px, 2px 2px, 8px 8px;
      animation: destroyedScreenStatic 0.08s infinite steps(3);
    }
  }

  @keyframes destroyedScreenStatic {
    0% { 
      opacity: 0.9; 
      filter: drop-shadow(0 0 12px #ff0033) contrast(400%) saturate(300%);
      background-position: 0 0, 4px 4px, 2px 2px, 8px 8px;
    }
    50% { 
      opacity: 0.5; 
      filter: drop-shadow(0 0 4px #500) contrast(200%);
      background-position: 5px 2px, -3px 6px, 1px 4px, -4px 2px;
    }
    100% { 
      opacity: 0.8; 
      filter: drop-shadow(0 0 10px #ff0033) contrast(500%);
      background-position: -2px 5px, 3px -4px, -3px 1px, 5px -2px;
    }
  }
</style>
</head>
<body>

<!-- شاشة الترحيب المنظمة والاحترافية بأسلوب Alastor -->
<div id="splash-screen">
  <div class="splash-box">
    <div class="splash-freq">[ FREQUENCY: 666.9 MHz // PENTAGRAM ]</div>
    <div class="splash-title">RADIO BROADCAST HIJACKED</div>
    <div class="splash-quote">"Smile, my dear! You're never fully dressed without one... and perhaps a bit of static!"</div>
    <button class="splash-btn" onclick="startExperience()">[ TUNE IN & INITIATE ]</button>
  </div>
</div>

<audio id="audio-alastor-quote">
  <source src="alastor-if-i-had-to-hurt-anyone-here.mp3" type="audio/mpeg">
</audio>

<div id="screen-container">
  <div class="crt-overlay"></div>
  
  <div class="main-ui" id="main-ui">
    <div class="ui-corner-tl"></div>
    <div class="ui-corner-br"></div>
    <div class="hex-bg" id="hex-bg"></div>
    <div class="header-grid">
      <div>STATION: 666.9 MHz - HAZBIN</div>
      <div>STATUS: RADIO_WAVE_ACTIVE</div>
    </div>
    <div class="alert-box"><div class="alert-title">HAZBIN FREQUENCY HIJACKED</div></div>
    <div class="hacker-brand">ALASTOR THE RADIO DEMON</div>
    <div class="progress-section">
      <div class="progress-header"><span id="target-ip">SOUL_FREQ: 192.666.##.##</span><span id="pct-text" style="color: var(--radio-red); font-weight: bold;">0.00%</span></div>
      <div class="progress-track"><div class="progress-fill" id="progress-bar"></div></div>
    </div>
    <div class="terminal-box" id="terminal"></div>
  </div>
</div>

<script>
  let audioCtx, staticGainNode;
  let sequenceStarted = false;

  function initAudio() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
  }

  function startBackgroundStatic() {
    let bufferSize = audioCtx.sampleRate * 2;
    let buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    let data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
    let noise = audioCtx.createBufferSource();
    noise.buffer = buffer;
    noise.loop = true;
    let filter = audioCtx.createBiquadFilter();
    filter.type = 'bandpass'; filter.frequency.value = 2500; filter.Q.value = 3.0;
    staticGainNode = audioCtx.createGain();
    staticGainNode.gain.value = 0.06;
    noise.connect(filter).connect(staticGainNode).connect(audioCtx.destination);
    noise.start();
  }

  function playDestroyedSpeakerGlitch() {
    if (!audioCtx) return;

    let now = audioCtx.currentTime;
    let osc1 = audioCtx.createOscillator();
    let osc2 = audioCtx.createOscillator();
    let distortion = audioCtx.createWaveShaper();
    let gainNode = audioCtx.createGain();

    osc1.type = 'square';
    osc2.type = 'sawtooth';

    osc1.frequency.setValueAtTime(2200, now);
    osc1.frequency.setValueAtTime(4500, now + 0.01);
    osc1.frequency.setValueAtTime(600, now + 0.025);
    osc1.frequency.setValueAtTime(5500, now + 0.04);
    osc1.frequency.setValueAtTime(1500, now + 0.055);
    osc1.frequency.setValueAtTime(6000, now + 0.07);

    osc2.frequency.setValueAtTime(1100, now);
    osc2.frequency.setValueAtTime(3800, now + 0.02);
    osc2.frequency.setValueAtTime(300, now + 0.045);

    function makeDistortionCurve(amount) {
      let k = amount,
        n_samples = 44100,
        curve = new Float32Array(n_samples),
        deg = Math.PI / 180;
      for (let i = 0; i < n_samples; ++i) {
        let x = (i * 2) / n_samples - 1;
        curve[i] = ((3 + k) * x * 20 * deg) / (Math.PI + k * Math.abs(x));
      }
      return curve;
    }
    distortion.curve = makeDistortionCurve(800);

    gainNode.gain.setValueAtTime(0.7, now);
    gainNode.gain.setValueAtTime(0.15, now + 0.03);
    gainNode.gain.setValueAtTime(0.6, now + 0.06);
    gainNode.gain.exponentialRampToValueAtTime(0.001, now + 0.16);

    osc1.connect(distortion);
    osc2.connect(distortion);
    distortion.connect(gainNode);
    gainNode.connect(audioCtx.destination);

    osc1.start(now);
    osc2.start(now);
    osc1.stop(now + 0.16);
    osc2.stop(now + 0.16);
  }

  function startBroadcastCutoffTone() {
    if (staticGainNode) staticGainNode.gain.value = 0; 
    
    let osc = audioCtx.createOscillator();
    let gain = audioCtx.createGain();
    
    osc.type = 'sine';
    osc.frequency.setValueAtTime(1000, audioCtx.currentTime);

    gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 4.5);

    osc.connect(gain).connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 4.5);
  }

  const mainUI = document.getElementById('main-ui');
  const terminal = document.getElementById('terminal');
  const progressBar = document.getElementById('progress-bar');
  const pctText = document.getElementById('pct-text');
  const audioAlastorQuote = document.getElementById('audio-alastor-quote');
  const screenContainer = document.getElementById('screen-container');
  const splashScreen = document.getElementById('splash-screen');

  let progress = 0;

  function startExperience() {
    if (sequenceStarted) return;
    sequenceStarted = true;

    splashScreen.style.opacity = '0';
    setTimeout(() => { splashScreen.style.display = 'none'; }, 400);
    screenContainer.style.opacity = '1';

    initAudio();
    startBackgroundStatic();

    playDestroyedSpeakerGlitch();
    mainUI.classList.add('severe-glitch');
    setTimeout(() => mainUI.classList.remove('severe-glitch'), 200);

    setTimeout(() => {
      addLog();
      updateProgress();
    }, 200);
  }

  const logsList = [
    { text: "TUNING INTO THE PENTAGRAM BROADCAST...", type: "red" },
    { text: "ESTABLISHING STATIC INTERFERENCE [FREQ 666Hz] ZZZZZ...", type: "green" },
    { text: "IF I WANTED TO HURT ANYONE HERE...", type: "red" },
    { text: "BROADCASTING OVER HELL'S AIRWAVES...", type: "green" },
    { text: "PSYCHOTIC SMILE INTENSITY: 100%", type: "red" },
    { text: "I WOULD HAVE DONE SO ALREADY!", type: "green" }
  ];

  function getTimestamp() {
    const now = new Date();
    return `${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}:${now.getSeconds().toString().padStart(2,'0')}.${Math.floor(Math.random()*999).toString().padStart(3,'0')}`;
  }

  function addLog() {
    if (progress >= 100) return;

    const row = document.createElement('div');
    row.className = 'log-row';
    const timeSpan = document.createElement('span');
    timeSpan.className = 'log-time';
    timeSpan.innerText = getTimestamp();

    const msgSpan = document.createElement('span');
    if (Math.random() > 0.4) {
      const logItem = logsList[Math.floor(Math.random() * logsList.length)];
      msgSpan.className = `log-msg ${logItem.type}`;
      msgSpan.innerText = `♪ ${logItem.text}`;
    } else {
      msgSpan.className = 'log-msg';
      msgSpan.style.color = '#ff4444';
      msgSpan.innerText = `[SPEAKER_DESTROYED] // SYSTEM_CRASH_666`;
    }

    row.appendChild(timeSpan);
    row.appendChild(msgSpan);
    terminal.appendChild(row);
    terminal.scrollTop = terminal.scrollHeight;

    if (Math.random() > 0.4) {
      mainUI.classList.add('severe-glitch');
      playDestroyedSpeakerGlitch(); 
      setTimeout(() => mainUI.classList.remove('severe-glitch'), 150);
    }

    setTimeout(addLog, Math.random() * 90 + 25);
  }

  function updateProgress() {
    if (progress < 100) {
      progress += Math.random() * 1.5; 
      if (progress > 100) progress = 100;
      
      progressBar.style.width = `${progress}%`;
      pctText.innerText = `${progress.toFixed(2)}%`;

      setTimeout(updateProgress, Math.random() * 60 + 15);
    } else {
      triggerEndSequence();
    }
  }

  function triggerEndSequence() {
    mainUI.classList.add('severe-glitch');
    playDestroyedSpeakerGlitch();
    
    setTimeout(() => {
      mainUI.classList.remove('severe-glitch');
      screenContainer.classList.add('crt-shut-off');
      
      startBroadcastCutoffTone();

      setTimeout(() => {
        audioAlastorQuote.volume = 1.0;
        audioAlastorQuote.play().catch(e => console.log("الصوت يتطلب مسار الملف الصحيح"));
      }, 700);
      
    }, 450); 
  }
</script>
</body>
</html>
