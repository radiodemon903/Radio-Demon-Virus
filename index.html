<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RADIO_BROADCAST // ALASTOR</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Creepster&family=Share+Tech+Mono&display=swap');

  :root {
    --bg-color: #050000;
    --radio-red: #ff0011;
    --dark-red: #3a0005;
    --alastor-green: #33ff00;
  }

  body, html {
    margin: 0; padding: 0; background-color: #000; color: var(--radio-red);
    font-family: 'Share Tech Mono', monospace; height: 100vh; overflow: hidden; user-select: none;
  }

  /* شاشة الترحيب المرعبة */
  #splash-screen {
    position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; 
    background: radial-gradient(circle, #1a0000 0%, #000000 100%);
    z-index: 9999; display: flex; justify-content: center; align-items: center;
    padding: 15px; box-sizing: border-box;
    transition: opacity 0.3s ease;
  }

  .splash-card {
    border: 2px solid var(--radio-red); background: rgba(5, 0, 0, 0.98);
    width: 100%; max-width: 480px; padding: 30px; box-sizing: border-box;
    position: relative; box-shadow: 0 0 60px rgba(255, 0, 17, 0.6), inset 0 0 30px rgba(255, 0, 17, 0.3);
    animation: cardPulse 2s infinite;
  }

  @keyframes cardPulse {
    0%, 100% { box-shadow: 0 0 50px rgba(255, 0, 17, 0.6), inset 0 0 20px rgba(255, 0, 17, 0.2); }
    50% { box-shadow: 0 0 80px rgba(255, 0, 17, 0.9), inset 0 0 40px rgba(255, 0, 17, 0.4); }
  }

  .splash-brand-title {
    text-align: center; font-family: 'Creepster', cursive; font-size: 3rem; color: var(--radio-red); 
    letter-spacing: 5px; text-shadow: 0 0 20px var(--radio-red), 4px 4px 0px #000, -2px -2px 0px var(--alastor-green); 
    margin-bottom: 5px;
  }

  .splash-action-btn {
    background: var(--dark-red); color: #fff; border: 1px solid var(--radio-red);
    padding: 16px; font-family: 'Share Tech Mono', monospace; font-size: 1.1rem; font-weight: bold;
    letter-spacing: 2px; cursor: pointer; width: 100%; transition: all 0.2s ease;
    box-shadow: 0 0 20px rgba(255, 0, 17, 0.5); text-align: center; text-shadow: 0 0 5px #fff;
    margin-top: 20px;
  }

  .splash-action-btn:hover {
    background: var(--radio-red); color: #000; box-shadow: 0 0 50px var(--radio-red);
  }

  #screen-container {
    width: 100vw; height: 100vh; background-color: var(--bg-color);
    position: relative; overflow: hidden; transform-origin: center center;
    display: none; opacity: 0; transition: opacity 0.2s ease;
  }

  .crt-overlay {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: 
      linear-gradient(rgba(10, 0, 0, 0) 50%, rgba(0, 0, 0, 0.95) 50%),
      repeating-linear-gradient(0deg, transparent, transparent 3px, rgba(255, 0, 17, 0.15) 3px, rgba(0, 0, 0, 0.2) 6px);
    background-size: 100% 6px, 100% 100%;
    z-index: 100; pointer-events: none;
    box-shadow: inset 0 0 200px rgba(0,0,0,1); 
  }

  .main-ui {
    position: relative; width: 96%; max-width: 700px; height: 96vh;
    margin: 2vh auto; padding: 20px; box-sizing: border-box; display: flex; flex-direction: column; z-index: 10;
  }

  .alastor-no-signal {
    position: relative;
    text-align: center;
    font-family: 'Creepster', cursive;
    font-size: 5rem;
    color: var(--radio-red);
    text-transform: uppercase;
    letter-spacing: 8px;
    margin: 20px 0;
    line-height: 1;
    text-shadow: 0 0 30px var(--radio-red), 5px 5px 0px #000, -3px -3px 0px var(--alastor-green);
  }

  .voodoo-symbols {
    font-family: monospace; font-size: 1.5rem; color: var(--alastor-green);
    letter-spacing: 15px; text-shadow: 0 0 10px var(--alastor-green);
  }

  .terminal-box { flex-grow: 1; border: 1px solid var(--radio-red); background: rgba(20, 0, 0, 0.7); padding: 10px; overflow: hidden; font-size: 0.8rem; line-height: 1.5; font-weight: bold; box-shadow: inset 0 0 20px rgba(255,0,17,0.2); }
  .log-row { display: flex; margin-bottom: 5px; }
  .log-time { color: var(--alastor-green); margin-right: 10px; width: 80px; text-shadow: 0 0 5px var(--alastor-green); }
  .log-msg { color: #fff; flex-grow: 1; word-break: break-all; }
  .log-msg.red { color: var(--radio-red); text-shadow: 0 0 10px var(--radio-red); font-size: 1rem; }

  /* جليتشات عنيفة للشاشة بالكامل */
  .severe-glitch { animation: alastorRage 0.08s infinite !important; }
  @keyframes alastorRage { 
    0% { transform: translate(0, 0) scale(1); filter: none; } 
    25% { transform: translate(var(--tx, -50px), var(--ty, 10px)) scaleY(1.1); filter: contrast(1000%) invert(20%) drop-shadow(15px 0 var(--alastor-green)); background-color: var(--radio-red); } 
    50% { transform: translate(calc(var(--tx, 50px) * -1), calc(var(--ty, -10px) * -1)) scaleX(1.1); filter: blur(2px) contrast(800%) saturate(1000%); color: #000; } 
    75% { transform: translate(calc(var(--tx, 20px) * 0.5), calc(var(--ty, 5px) * 0.5)); filter: contrast(1000%) grayscale(100%) invert(100%); } 
    100% { transform: translate(0, 0) scale(1); filter: none; } 
  }

  .crt-shut-off { animation: turn-off 0.4s cubic-bezier(0.23, 1, 0.32, 1) forwards; }
  @keyframes turn-off {
    0% { transform: scale(1, 1); filter: brightness(1) contrast(1); }
    20% { transform: scale(1.1, 0.01); filter: brightness(80) contrast(1000%); background-color: var(--radio-red); }
    50% { transform: scale(0.01, 0.005); filter: brightness(100); background-color: #fff; box-shadow: 0 0 300px #fff; }
    100% { transform: scale(0, 0); filter: brightness(0); opacity: 1; background-color: #000 !important; }
  }

  #demon-glitch-overlay {
    position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
    background: repeating-linear-gradient(0deg, transparent, transparent 5px, rgba(255,0,17,0.9) 5px, rgba(0,0,0,0.9) 10px);
    z-index: 99999; animation: demonLaughGlitch 0.03s infinite; pointer-events: none;
    display: none; mix-blend-mode: multiply;
  }
  @keyframes demonLaughGlitch {
    0% { filter: invert(0) contrast(800%); transform: translate(20px, 0) scale(1.1); }
    50% { filter: invert(100%) contrast(1000%); transform: translate(-30px, 0) scale(1.2); }
    100% { filter: invert(0) contrast(800%); transform: translate(15px, 0) scale(1.05); }
  }

  #pure-black-screen {
    position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
    background-color: #000; z-index: 999999; display: none; pointer-events: auto;
  }
</style>
</head>
<body>

<audio id="alastor-laugh-audio" src="https://www.myinstants.com/media/sounds/alastor-laugh.mp3" preload="auto"></audio>

<div id="splash-screen">
  <div class="splash-card">
    <div class="splash-brand-title">ALASTOR</div>
    <div style="text-align:center; color: var(--alastor-green); font-size: 2rem; margin-bottom: 20px;">⛧ 📻 ⛧</div>
    <button class="splash-action-btn" id="start-btn">
      [ INITIATE BROADCAST OVERRIDE ]
    </button>
  </div>
</div>

<div id="screen-container">
  <div class="crt-overlay"></div>
  
  <div class="main-ui" id="main-ui">
    <div class="alastor-no-signal">NO SIGNAL</div>
    <div class="voodoo-symbols" style="text-align: center;">⸸ ⍟ ☠ ⸸</div>

    <div style="margin: 20px 0; border-top: 2px dashed var(--radio-red);"></div>
    
    <div class="terminal-box" id="terminal"></div>
  </div>
</div>

<div id="demon-glitch-overlay"></div>
<div id="pure-black-screen"></div>

<script>
  let audioCtx = null;
  let staticGainNode = null;
  let sequenceStarted = false;

  function initAudio() {
    try {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    } catch(e) {
      console.log("Audio Context Skipped:", e);
    }
  }

  function startBackgroundStatic() {
    if (!audioCtx) return;
    try {
      let bufferSize = audioCtx.sampleRate * 2;
      let buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      let data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
      let noise = audioCtx.createBufferSource();
      noise.buffer = buffer; noise.loop = true;
      
      let filter = audioCtx.createBiquadFilter();
      filter.type = 'bandpass'; filter.frequency.value = 800;
      
      staticGainNode = audioCtx.createGain();
      staticGainNode.gain.value = 0.15;
      
      noise.connect(filter).connect(staticGainNode).connect(audioCtx.destination);
      noise.start();
    } catch(e) {}
  }

  function playDemonicRadioScreech() {
    if (!audioCtx) return;
    try {
      let now = audioCtx.currentTime;
      let osc1 = audioCtx.createOscillator();
      let osc2 = audioCtx.createOscillator();
      let lfo = audioCtx.createOscillator();
      let lfoGain = audioCtx.createGain();
      let distortion = audioCtx.createWaveShaper();
      let mainGain = audioCtx.createGain();

      osc1.type = 'sawtooth';
      osc2.type = 'sine';
      lfo.type = 'square';

      osc1.frequency.setValueAtTime(4000, now);
      osc1.frequency.exponentialRampToValueAtTime(300, now + 0.2);

      osc2.frequency.setValueAtTime(60, now);
      osc2.frequency.linearRampToValueAtTime(20, now + 0.2);

      lfo.frequency.value = 25;

      let k = 4000;
      let curve = new Float32Array(44100);
      let deg = Math.PI / 180;
      for (let i = 0; i < 44100; ++i) {
        let x = (i * 2) / 44100 - 1;
        curve[i] = ((3 + k) * x * 80 * deg) / (Math.PI + k * Math.abs(x));
      }
      distortion.curve = curve;

      lfo.connect(lfoGain.gain);
      mainGain.gain.setValueAtTime(1.0, now);
      mainGain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);

      osc1.connect(distortion);
      osc2.connect(distortion);
      distortion.connect(lfoGain);
      lfoGain.connect(mainGain);
      mainGain.connect(audioCtx.destination);

      osc1.start(now);
      osc2.start(now);
      lfo.start(now);
      
      osc1.stop(now + 0.3);
      osc2.stop(now + 0.3);
      lfo.stop(now + 0.3);
    } catch(e) {}
  }

  function playLongTeetTone() {
    if (!audioCtx) return;
    try {
      if (staticGainNode) staticGainNode.gain.value = 0;
      let now = audioCtx.currentTime;
      let osc = audioCtx.createOscillator();
      let gain = audioCtx.createGain();

      osc.type = 'sine';
      osc.frequency.setValueAtTime(1400, now);

      gain.gain.setValueAtTime(0.8, now);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 2.5);

      osc.connect(gain).connect(audioCtx.destination);
      osc.start(now); osc.stop(now + 2.5);
    } catch(e) {}
  }

  function playAlastorDemonLaugh() {
    const laughAudio = document.getElementById('alastor-laugh-audio');
    if (laughAudio) {
      laughAudio.currentTime = 0; 
      laughAudio.volume = 1.0;
      laughAudio.play().catch(e => console.log("Audio play blocked:", e));
    }
  }

  const mainUI = document.getElementById('main-ui');
  const terminal = document.getElementById('terminal');
  const screenContainer = document.getElementById('screen-container');
  const splashScreen = document.getElementById('splash-screen');
  const demonGlitchOverlay = document.getElementById('demon-glitch-overlay');
  const pureBlackScreen = document.getElementById('pure-black-screen');
  const startBtn = document.getElementById('start-btn');

  let logsCount = 0;

  function randomizeGlitchDirection() {
    const rx = (Math.random() * 200 - 100) + 'px'; 
    const ry = (Math.random() * 30 - 15) + 'px'; 
    mainUI.style.setProperty('--tx', rx); mainUI.style.setProperty('--ty', ry);
  }

  function startExperience() {
    if (sequenceStarted) return;
    sequenceStarted = true;

    // تفعيل الـ AudioContext فوراً داخل حدث الضغط لتجنب حظر المتصفح
    initAudio(); 

    // إخفاء شاشة الترحيب وإظهار الشاشة الرئيسية بسلاسة
    splashScreen.style.opacity = '0';
    setTimeout(() => { 
      splashScreen.style.display = 'none'; 
      screenContainer.style.display = 'block';
      setTimeout(() => { 
        screenContainer.style.opacity = '1'; 
        startBackgroundStatic();
        playDemonicRadioScreech();
        addLog();
      }, 50);
    }, 300);
  }

  startBtn.addEventListener('click', startExperience);

  const errorLogs = [
    "!!! SYSTEM OVERRIDE IN PROGRESS !!!",
    "SOUL_CONTRACT_DETECTED_ERROR",
    "FREQUENCY_666_HIJACKED",
    "⛧ BROADCAST CORRUPTED ⛧",
    "HE_IS_HERE"
  ];

  function getTimestamp() {
    return `ERR_666_${Math.floor(Math.random()*99).toString().padStart(2,'0')}`;
  }

  function addLog() {
    if (logsCount >= 25) { 
      triggerEndSequence();
      return;
    }
    
    logsCount++;
    const row = document.createElement('div'); row.className = 'log-row';
    const timeSpan = document.createElement('span'); timeSpan.className = 'log-time'; timeSpan.innerText = getTimestamp();
    const msgSpan = document.createElement('span');
    
    if (Math.random() > 0.3) {
      msgSpan.className = `log-msg`; msgSpan.innerText = `>>> DECRYPTING RADIO WAVES...`;
    } else {
      msgSpan.className = 'log-msg red'; 
      msgSpan.innerText = errorLogs[Math.floor(Math.random() * errorLogs.length)];
    }
    
    row.appendChild(timeSpan); row.appendChild(msgSpan);
    terminal.appendChild(row); terminal.scrollTop = terminal.scrollHeight;

    if (Math.random() > 0.4) {
      randomizeGlitchDirection(); 
      mainUI.classList.add('severe-glitch'); 
      playDemonicRadioScreech(); 
      setTimeout(() => mainUI.classList.remove('severe-glitch'), 150);
    }
    
    let nextTime = Math.random() * (120 - (logsCount * 3)) + 20; 
    setTimeout(addLog, Math.max(nextTime, 20));
  }

  function triggerEndSequence() {
    randomizeGlitchDirection(); 
    mainUI.classList.add('severe-glitch');
    playDemonicRadioScreech();
    
    setTimeout(() => {
      mainUI.classList.remove('severe-glitch');
      screenContainer.classList.add('crt-shut-off');

      playLongTeetTone(); 

      setTimeout(() => {
        demonGlitchOverlay.style.display = 'block'; 
        playAlastorDemonLaugh(); 

        setTimeout(() => {
          demonGlitchOverlay.style.display = 'none';
          pureBlackScreen.style.display = 'block'; 
        }, 3000);

      }, 2200);

    }, 450); 
  }
</script>
</body>
</html>
