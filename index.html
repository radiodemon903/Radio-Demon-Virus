<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SYS.OVERRIDE // ALASTOR</title>
    <style>
        :root {
            --bg-deep: #030000;
            --alastor-crimson: #8b0000;
            --alastor-blood: #ff001e;
            --alastor-glow: rgba(255, 0, 30, 0.7);
            --text-muted: #880000;
            --glitch-offset-1: 3px;
            --glitch-offset-2: -3px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: #000;
            color: var(--alastor-blood);
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            user-select: none;
            cursor: crosshair;
        }

        /* --- COMPLEX CANVAS LAYERS --- */
        #dot-matrix, #static-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            pointer-events: none;
        }
        #dot-matrix { z-index: 1; opacity: 0.4; }
        #static-overlay { z-index: 50; mix-blend-mode: overlay; opacity: 0.15; }

        .scanlines {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.8) 50%);
            background-size: 100% 4px;
            z-index: 49;
            pointer-events: none;
        }

        /* --- START BUTTON --- */
        #start-gate {
            position: fixed;
            inset: 0;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .btn-core {
            border: 1px solid var(--alastor-blood);
            padding: 15px 40px;
            font-size: 1.5rem;
            color: var(--alastor-blood);
            background: rgba(10, 0, 0, 0.8);
            letter-spacing: 10px;
            text-transform: uppercase;
            box-shadow: 0 0 20px var(--alastor-glow);
            transition: all 0.1s;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }
        .btn-core:hover {
            background: var(--alastor-blood);
            color: #000;
            box-shadow: 0 0 40px var(--alastor-blood);
        }

        /* --- ORGANIZED & CONSTRAINED MAIN FRAME --- */
        #app-container {
            width: 100%;
            max-width: 480px; /* Tightly constrained for organization */
            height: 85vh;
            max-height: 800px;
            position: relative;
            z-index: 10;
            display: none; /* Hidden initially */
            flex-direction: column;
            background: radial-gradient(circle at center, rgba(20, 0, 0, 0.9) 0%, rgba(0, 0, 0, 0.95) 100%);
            border: 1px solid #330000;
            box-shadow: 0 0 50px rgba(255, 0, 0, 0.15), inset 0 0 30px rgba(0,0,0,1);
            padding: 25px;
        }

        /* The exact layout elements requested */
        .reticle {
            position: absolute;
            width: 20px; height: 20px;
            border: 2px solid var(--alastor-crimson);
            box-shadow: 0 0 8px var(--alastor-glow);
        }
        .reticle.tl { top: 10px; left: 10px; border-right: none; border-bottom: none; }
        .reticle.tr { top: 10px; right: 10px; border-left: none; border-bottom: none; }
        .reticle.bl { bottom: 10px; left: 10px; border-right: none; border-top: none; }
        .reticle.br { bottom: 10px; right: 10px; border-left: none; border-top: none; }

        .status-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.7rem;
            color: var(--text-muted);
            margin-bottom: 20px;
            letter-spacing: 1px;
            font-weight: bold;
        }

        .warning-box {
            border: 1px solid var(--alastor-blood);
            background: repeating-linear-gradient(45deg, #110000, #110000 5px, #050000 5px, #050000 10px);
            text-align: center;
            padding: 12px;
            margin-bottom: 25px;
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.3);
            position: relative;
        }

        .warning-box h2 {
            font-size: 1.2rem;
            letter-spacing: 3px;
            color: var(--alastor-blood);
            text-shadow: 0 0 8px var(--alastor-blood);
            margin-bottom: 3px;
        }

        .warning-box p {
            font-size: 0.65rem;
            letter-spacing: 2px;
            color: var(--text-muted);
        }

        .main-title {
            text-align: center;
            font-size: 2.2rem;
            font-family: 'Impact', sans-serif;
            letter-spacing: 10px;
            color: var(--alastor-blood);
            text-shadow: 2px 0px 0px #000, -2px 0px 0px #330000, 0 0 20px var(--alastor-blood);
            margin-bottom: 25px;
            position: relative;
        }

        .progress-info {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: var(--alastor-crimson);
            margin-bottom: 6px;
        }

        .progress-bar-bg {
            width: 100%;
            height: 10px;
            background: #0a0000;
            border: 1px solid #330000;
            margin-bottom: 20px;
            position: relative;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: var(--alastor-blood);
            box-shadow: 0 0 10px var(--alastor-blood);
            transition: width 0.05s linear;
        }

        .terminal-box {
            flex-grow: 1;
            width: 100%;
            background: rgba(0,0,0,0.4);
            border-top: 1px solid #220000;
            overflow: hidden;
            font-size: 0.65rem;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding-top: 10px;
        }

        .log-line {
            margin: 1px 0;
            display: flex;
            gap: 8px;
            line-height: 1.3;
        }

        .log-time { color: #550000; min-width: 80px; }
        .log-msg { color: var(--alastor-blood); word-break: break-all; }
        .log-msg.err { color: #fff; text-shadow: 0 0 4px #fff; }

        /* --- SHARP CUTS & GLITCH CLASSES --- */
        .sharp-cut-1 { clip-path: polygon(0 0, 100% 0, 100% 35%, 0 35%); transform: translateX(5px); filter: hue-rotate(90deg); }
        .sharp-cut-2 { clip-path: polygon(0 45%, 100% 45%, 100% 60%, 0 60%); transform: translateX(-8px) scale(1.02); }
        .sharp-cut-3 { clip-path: polygon(0 75%, 100% 75%, 100% 100%, 0 100%); transform: translateY(4px); opacity: 0.8; }
        .rgb-split { text-shadow: var(--glitch-offset-1) 0 blue, var(--glitch-offset-2) 0 red; }

        /* --- ENDING SEQUENCE --- */
        .power-down {
            animation: tv-collapse 0.4s cubic-bezier(0.1, 0.8, 0.1, 1) forwards !important;
        }

        @keyframes tv-collapse {
            0% { transform: scale(1, 1); filter: brightness(2); }
            40% { transform: scale(1, 0.002); filter: brightness(10); }
            100% { transform: scale(0, 0); filter: brightness(0); opacity: 0; display: none; }
        }

        #final-scare {
            position: fixed;
            inset: 0;
            background: #000;
            z-index: 999;
            display: none; 
            justify-content: center;
            align-items: center;
        }

        #jumpscare-img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            animation: frantic-stutter 0.04s infinite;
            mix-blend-mode: screen;
        }

        @keyframes frantic-stutter {
            0% { transform: translate(0, 0) scale(1); filter: contrast(1.2); }
            33% { transform: translate(-15px, 10px) scale(1.05); filter: contrast(2) invert(1); }
            66% { transform: translate(15px, -10px) scale(0.95); filter: contrast(1.5) hue-rotate(90deg); }
            100% { transform: translate(-5px, -5px) scale(1); filter: contrast(1.2); }
        }
    </style>
</head>
<body>

    <!-- Complex Visual Layers -->
    <canvas id="dot-matrix"></canvas>
    <canvas id="static-overlay"></canvas>
    <div class="scanlines"></div>

    <!-- Start Gate -->
    <div id="start-gate">
        <div class="btn-core" id="init-btn">INITIALIZE</div>
    </div>

    <!-- Organized Core Interface -->
    <div id="app-container">
        <div class="reticle tl"></div>
        <div class="reticle tr"></div>
        <div class="reticle bl"></div>
        <div class="reticle br"></div>

        <div class="status-header">
            <span>PRTCL: RADIO_DEMON_V2</span>
            <span id="sys-status">STATUS: ROOT_ENGAGED</span>
        </div>

        <div class="warning-box">
            <h2>SYSTEM BREACHED</h2>
            <p>CRITICAL UNAUTHORIZED ACCESS DETECTED</p>
        </div>

        <div class="main-title" id="glitch-title">A L A S T O R</div>
        
        <div class="progress-info">
            <span>TRGT_IP: 192.168.119.232</span>
            <span id="perc-display">0.00%</span>
        </div>
        
        <div class="progress-bar-bg">
            <div class="progress-fill" id="p-bar"></div>
        </div>

        <div class="terminal-box" id="term-out"></div>
    </div>

    <!-- The Requested Jumpscare -->
    <div id="final-scare">
        <img id="jumpscare-img" src="d769884480dfdee13e47e0526d22f906.jpg" alt="Alastor">
    </div>

    <script>
        /** 
         * COMPLEX SYSTEM ARCHITECTURE
         * Utilizing ES6 Classes for compartmentalized logic.
         */

        // --- 1. VISUAL ENGINE: The Dots & Static ---
        class VisualEngine {
            constructor() {
                this.dotCanvas = document.getElementById('dot-matrix');
                this.dotCtx = this.dotCanvas.getContext('2d', { alpha: false });
                this.staticCanvas = document.getElementById('static-overlay');
                this.staticCtx = this.staticCanvas.getContext('2d');
                
                this.resize();
                window.addEventListener('resize', () => this.resize());
                
                this.dots = [];
                this.initDots();
                this.renderLoop();
            }

            resize() {
                this.width = window.innerWidth;
                this.height = window.innerHeight;
                this.dotCanvas.width = this.width;
                this.dotCanvas.height = this.height;
                this.staticCanvas.width = this.width;
                this.staticCanvas.height = this.height;
            }

            initDots() {
                const spacing = 30;
                for(let x = 0; x < this.width; x += spacing) {
                    for(let y = 0; y < this.height; y += spacing) {
                        this.dots.push({ x, y, baseAlpha: Math.random() * 0.5 });
                    }
                }
            }

            renderLoop() {
                // Background
                this.dotCtx.fillStyle = '#020000';
                this.dotCtx.fillRect(0, 0, this.width, this.height);

                // Draw pulsing dot matrix
                const time = Date.now() * 0.002;
                this.dotCtx.fillStyle = 'rgba(255, 0, 0, 1)';
                
                for(let i=0; i<this.dots.length; i++) {
                    const d = this.dots[i];
                    // Complex sine wave math for breathing effect
                    const alpha = d.baseAlpha + Math.sin(time + (d.x * 0.01) + (d.y * 0.02)) * 0.3;
                    if(alpha > 0.1) {
                        this.dotCtx.globalAlpha = alpha;
                        this.dotCtx.fillRect(d.x, d.y, 2, 2);
                    }
                }

                // Render high-speed static
                const imgData = this.staticCtx.createImageData(this.width, this.height);
                const buf = new Uint32Array(imgData.data.buffer);
                for (let i = 0; i < buf.length; i+=4) { // optimization step
                    if (Math.random() > 0.95) buf[i] = 0xff0000aa; // Red static
                    else if (Math.random() > 0.98) buf[i] = 0xffffffff; // White static
                }
                this.staticCtx.putImageData(imgData, 0, 0);

                requestAnimationFrame(() => this.renderLoop());
            }
        }

        // --- 2. AUDIO ENGINE: Complex Synthesis & Distortion ---
        class AudioEngine {
            constructor() {
                this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                this.masterGain = this.ctx.createGain();
                this.masterGain.connect(this.ctx.destination);
                
                // Distortion curve for extreme crunch
                this.distortion = this.ctx.createWaveShaper();
                this.distortion.curve = this.makeDistortionCurve(400);
                this.distortion.oversample = '4x';
                
                this.distortion.connect(this.masterGain);
            }

            makeDistortionCurve(amount) {
                const k = typeof amount === 'number' ? amount : 50,
                    n_samples = 44100,
                    curve = new Float32Array(n_samples),
                    deg = Math.PI / 180;
                for (let i = 0; i < n_samples; ++i) {
                    const x = i * 2 / n_samples - 1;
                    curve[i] = (3 + k) * x * 20 * deg / (Math.PI + k * Math.abs(x));
                }
                return curve;
            }

            startDrone() {
                this.drone = this.ctx.createOscillator();
                this.droneGain = this.ctx.createGain();
                this.drone.type = 'sawtooth';
                this.drone.frequency.value = 45;
                this.droneGain.gain.value = 0.03;
                
                this.drone.connect(this.droneGain);
                this.droneGain.connect(this.distortion);
                this.drone.start();

                // LFO to modulate drone
                this.lfo = this.ctx.createOscillator();
                this.lfo.frequency.value = 0.5;
                const lfoGain = this.ctx.createGain();
                lfoGain.gain.value = 10;
                this.lfo.connect(lfoGain);
                lfoGain.connect(this.drone.frequency);
                this.lfo.start();
            }

            triggerLaugh() {
                const now = this.ctx.currentTime;
                
                // Burst of white noise
                const bufferSize = this.ctx.sampleRate * 2;
                const noiseBuf = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                const output = noiseBuf.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) output[i] = Math.random() * 2 - 1;
                
                const noise = this.ctx.createBufferSource();
                noise.buffer = noiseBuf;
                const noiseGain = this.ctx.createGain();
                noiseGain.gain.setValueAtTime(0.8, now);
                noiseGain.gain.exponentialRampToValueAtTime(0.01, now + 1.5);
                
                noise.connect(this.distortion);
                noise.connect(noiseGain);
                noiseGain.connect(this.masterGain);
                noise.start(now);

                // Stutter synths
                for(let i=0; i<12; i++) {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(200 - (i*8), now + (i*0.15)); 

                    gain.gain.setValueAtTime(0, now + (i*0.15));
                    gain.gain.linearRampToValueAtTime(1, now + (i*0.15) + 0.01);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + (i*0.15) + 0.1);
                    
                    osc.connect(gain);
                    gain.connect(this.distortion);
                    osc.start(now + (i*0.15));
                    osc.stop(now + (i*0.15) + 0.12);
                }
            }

            playWhistle() {
                this.droneGain.gain.setValueAtTime(0, this.ctx.currentTime);
                this.whistle = this.ctx.createOscillator();
                this.whistleGain = this.ctx.createGain();
                this.whistle.type = 'sine';
                this.whistle.frequency.value = 1200;
                this.whistleGain.gain.value = 0.4;
                this.whistle.connect(this.whistleGain);
                this.whistleGain.connect(this.masterGain);
                this.whistle.start();
            }

            stopWhistle() {
                if(this.whistleGain) {
                    this.whistleGain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.1);
                    setTimeout(() => this.whistle.stop(), 100);
                }
            }
        }

        // --- 3. GLITCH & UI ENGINE ---
        class AppController {
            constructor() {
                this.container = document.getElementById('app-container');
                this.pBar = document.getElementById('p-bar');
                this.pText = document.getElementById('perc-display');
                this.terminal = document.getElementById('term-out');
                
                this.progress = 0;
                this.logs = [
                    "ENCRYPTING LOCAL DISK (RANSOM-MODE)",
                    "DECRYPTING PRIVATE RSA KEYS...",
                    "CAMERA NODE INTERCEPTED",
                    "INJECTING ALASTOR PAYLOAD...",
                    "FIREWALL BYPASS: SUCCESS",
                    "DUMPING SYSTEM MEMORY...",
                    "DOWNLOADING USER.DAT HASHES",
                    "CORRUPTING ROOT PROTOCOL..."
                ];
            }

            getTimestamp() {
                const d = new Date();
                return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}:${String(d.getSeconds()).padStart(2,'0')}.${String(d.getMilliseconds()).padStart(3,'0')}>>`;
            }

            genMem() {
                return "0x" + Math.floor(Math.random()*0xFFFFFFFF).toString(16).toUpperCase().padStart(8, '0') + " : PTR_CORRUPTION_ERR";
            }

            doSharpGlitch() {
                const classes = ['sharp-cut-1', 'sharp-cut-2', 'sharp-cut-3', 'rgb-split'];
                const cls = classes[Math.floor(Math.random() * classes.length)];
                this.container.classList.add(cls);
                setTimeout(() => this.container.classList.remove(cls), 50 + Math.random()*100);
            }

            start(audioEngine) {
                this.audio = audioEngine;
                this.container.style.display = 'flex';
                this.audio.startDrone();
                
                // Sharp Glitch Loop
                this.glitchInt = setInterval(() => {
                    if(Math.random() > 0.6) this.doSharpGlitch();
                }, 150);

                // Logic Loops
                this.runProgress();
                this.runTerminal();
            }

            runProgress() {
                if(this.progress >= 100) return;
                
                // Stochastic non-linear progression
                this.progress += Math.random() * 4 + 0.5;
                if(this.progress > 100) this.progress = 100;
                
                this.pBar.style.width = this.progress + '%';
                this.pText.innerText = this.progress.toFixed(2) + '%';

                if(this.progress === 100) {
                    clearInterval(this.glitchInt);
                    document.getElementById('sys-status').innerText = "STATUS: FATAL_ERROR";
                    document.getElementById('sys-status').style.color = "#fff";
                    setTimeout(() => triggerEnding(this.audio, this.container), 1000);
                } else {
                    setTimeout(() => this.runProgress(), Math.random() * 300 + 50);
                }
            }

            runTerminal() {
                if(this.progress >= 100) return;
                
                const line = document.createElement('div');
                line.className = 'log-line';
                line.innerHTML = `<span class="log-time">${this.getTimestamp()}</span>`;
                
                const msg = document.createElement('span');
                if(Math.random() > 0.3) {
                    msg.className = 'log-msg';
                    msg.innerText = this.logs[Math.floor(Math.random() * this.logs.length)];
                } else {
                    msg.className = 'log-msg err';
                    msg.innerText = this.genMem();
                }
                
                line.appendChild(msg);
                this.terminal.appendChild(line);
                
                if(this.terminal.childElementCount > 12) {
                    this.terminal.removeChild(this.terminal.firstChild);
                }

                setTimeout(() => this.runTerminal(), 80);
            }
        }

        // --- 4. EXECUTION SEQUENCE ---
        const visuals = new VisualEngine();
        let audio, app;

        document.getElementById('init-btn').addEventListener('click', () => {
            document.getElementById('start-gate').style.display = 'none';
            if (document.documentElement.requestFullscreen) {
                document.documentElement.requestFullscreen().catch(()=>console.log("FS Blocked"));
            }
            
            audio = new AudioEngine();
            app = new AppController();
            
            // Allow audio context to resume properly
            if (audio.ctx.state === 'suspended') audio.ctx.resume();
            
            app.start(audio);
        });

        function triggerEnding(audioEngine, uiContainer) {
            // 1. Play constant high whistle
            audioEngine.playWhistle();

            // 2. Collapse the organized window
            uiContainer.classList.add('power-down');
            
            // 3. Cut to absolute black
            setTimeout(() => {
                document.getElementById('dot-matrix').style.display = 'none';
                document.getElementById('static-overlay').style.display = 'none';
                document.querySelector('.scanlines').style.display = 'none';
                document.body.style.backgroundColor = '#000';
                
                // 4. Wait in silence (except the whistle) then jumpscare
                setTimeout(() => {
                    audioEngine.stopWhistle();
                    document.getElementById('final-scare').style.display = 'flex';
                    audioEngine.triggerLaugh(); // Stutter laugh triggers alongside image
                }, 1600); // 1.6s of tension

            }, 400);
        }
    </script>
</body>
</html>
