<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE RADIO DEMON</title>
    <style>
        :root {
            --alastor-dark: #1a0000;
            --alastor-red: #8b0000;
            --alastor-bright: #ff001e;
            --bg-dark: #000000;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-dark);
            color: var(--alastor-bright);
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            user-select: none;
        }

        /* -------------------------------------- */
        /* CRT & GLITCH EFFECTS                   */
        /* -------------------------------------- */
        .scanlines {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.7) 50%),
                        linear-gradient(90deg, rgba(255,0,0,0.03), rgba(0,255,0,0.01), rgba(0,0,255,0.03));
            background-size: 100% 4px, 6px 100%;
            z-index: 50;
            pointer-events: none;
        }

        .heavy-glitch {
            animation: violent-tear 0.1s infinite steps(2);
            filter: contrast(2) saturate(2) hue-rotate(-10deg);
            text-shadow: -2px 0 red, 2px 0 cyan;
        }

        @keyframes violent-tear {
            0% { clip-path: inset(20% 0 80% 0); transform: translate(-5px, 2px); }
            20% { clip-path: inset(60% 0 10% 0); transform: translate(5px, -2px); }
            40% { clip-path: inset(40% 0 50% 0); transform: translate(-5px, 5px); }
            60% { clip-path: inset(80% 0 5% 0); transform: translate(10px, -2px); }
            80% { clip-path: inset(10% 0 70% 0); transform: translate(-2px, -5px); }
            100% { clip-path: inset(30% 0 40% 0); transform: translate(2px, 2px); }
        }

        /* -------------------------------------- */
        /* ALASTOR "ON AIR" START BUTTON          */
        /* -------------------------------------- */
        #start-overlay {
            position: fixed;
            inset: 0;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            cursor: pointer;
        }

        .on-air-btn {
            border: 4px solid var(--alastor-red);
            border-radius: 10px;
            padding: 30px 60px;
            font-size: 3rem;
            color: var(--alastor-bright);
            background: #0a0000;
            font-family: 'Impact', sans-serif;
            letter-spacing: 10px;
            text-transform: uppercase;
            box-shadow: 0 0 20px var(--alastor-red), inset 0 0 15px var(--alastor-red);
            transition: all 0.2s;
            position: relative;
            text-shadow: 0 0 10px var(--alastor-bright), 0 0 20px var(--alastor-bright);
        }

        .on-air-btn:hover {
            background: var(--alastor-dark);
            box-shadow: 0 0 50px var(--alastor-bright), inset 0 0 30px var(--alastor-bright);
            transform: scale(1.05);
            animation: text-shake 0.1s infinite;
        }

        @keyframes text-shake {
            0% { transform: translate(2px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(0px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(2px, 1px) rotate(-1deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            90% { transform: translate(2px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }

        /* -------------------------------------- */
        /* ORGANIZED LOADING TERMINAL             */
        /* -------------------------------------- */
        #main-frame {
            width: 85%;
            max-width: 800px;
            border: 2px solid #330000;
            background: linear-gradient(180deg, #050000 0%, #110000 100%);
            position: relative;
            z-index: 10;
            display: none; /* Hidden until clicked */
            flex-direction: column;
            box-shadow: 0 0 40px rgba(255, 0, 0, 0.2);
        }

        .header-bar {
            background: var(--alastor-red);
            color: #000;
            padding: 10px 20px;
            font-weight: bold;
            font-size: 1.2rem;
            display: flex;
            justify-content: space-between;
            letter-spacing: 2px;
        }

        .content-area {
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .demon-title {
            font-size: 4rem;
            font-family: 'Impact', serif;
            letter-spacing: 8px;
            color: var(--alastor-bright);
            text-shadow: 4px 4px 0px #330000;
            margin-bottom: 30px;
            animation: text-shake 3s infinite;
        }

        .progress-container {
            width: 100%;
            margin-bottom: 20px;
        }

        .progress-label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-weight: bold;
            color: #aaa;
        }

        .progress-bar-bg {
            width: 100%;
            height: 30px;
            background: #000;
            border: 1px solid var(--alastor-red);
            position: relative;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: repeating-linear-gradient(
                45deg,
                var(--alastor-red),
                var(--alastor-red) 10px,
                var(--alastor-bright) 10px,
                var(--alastor-bright) 20px
            );
            box-shadow: 0 0 20px var(--alastor-bright);
            transition: width 0.1s;
        }

        .terminal-box {
            width: 100%;
            height: 180px;
            background: #000;
            border: 1px solid #440000;
            padding: 15px;
            overflow: hidden;
            font-size: 0.85rem;
            color: #cc0000;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
        }

        .log-line {
            margin: 2px 0;
            white-space: nowrap;
            opacity: 0.8;
        }

        /* -------------------------------------- */
        /* ENDING SEQUENCE STYLES                 */
        /* -------------------------------------- */
        .tv-off-force {
            animation: collapse-screen 0.5s cubic-bezier(0.7, 0, 0.84, 0) forwards !important;
        }

        @keyframes collapse-screen {
            0% { transform: scale(1, 1); filter: brightness(5); }
            50% { transform: scale(1, 0.005); filter: brightness(10); }
            80% { transform: scale(0.002, 0.005); filter: brightness(20); }
            100% { transform: scale(0, 0); filter: brightness(0); opacity: 0; display: none; }
        }

        /* The terrifying final image wrapper */
        #final-scare {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: #000;
            z-index: 200;
            display: none; /* Hidden until the very end */
            justify-content: center;
            align-items: center;
        }

        /* The requested image, glitching infinitely */
        #jumpscare-img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            animation: final-glitch 0.05s infinite;
            mix-blend-mode: screen;
        }

        @keyframes final-glitch {
            0% { transform: translate(0, 0) scale(1); filter: hue-rotate(0deg) contrast(1.5); clip-path: inset(0 0 0 0); }
            25% { transform: translate(-10px, 5px) scale(1.02); filter: hue-rotate(90deg) contrast(2); clip-path: inset(10% 0 40% 0); }
            50% { transform: translate(10px, -5px) scale(0.98); filter: hue-rotate(-90deg) contrast(3) invert(1); clip-path: inset(50% 0 10% 0); }
            75% { transform: translate(-5px, -10px) scale(1.05); filter: hue-rotate(180deg) contrast(1.2); clip-path: inset(20% 0 60% 0); }
            100% { transform: translate(5px, 10px) scale(1); filter: hue-rotate(0deg) contrast(1.5); clip-path: inset(0 0 0 0); }
        }

        #static-canvas {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            opacity: 0; pointer-events: none; z-index: 5;
        }
    </style>
</head>
<body>

    <div class="scanlines"></div>
    <canvas id="static-canvas"></canvas>

    <!-- Start Button -->
    <div id="start-overlay">
        <div class="on-air-btn" id="start-btn">ON AIR</div>
    </div>

    <!-- Main Loading Interface -->
    <div id="main-frame">
        <div class="header-bar">
            <span>SYS.REQ: OVERRIDE</span>
            <span id="status-text">WAITING...</span>
        </div>
        <div class="content-area">
            <div class="demon-title">ALASTOR</div>
            
            <div class="progress-container">
                <div class="progress-label">
                    <span>BROADCAST INFILTRATION</span>
                    <span id="percent-text">0.00%</span>
                </div>
                <div class="progress-bar-bg">
                    <div class="progress-fill" id="progress-fill"></div>
                </div>
            </div>

            <div class="terminal-box" id="terminal"></div>
        </div>
    </div>

    <!-- Final Ending Jumpscare Container -->
    <div id="final-scare">
        <img id="jumpscare-img" src="d769884480dfdee13e47e0526d22f906.jpg" alt="The Radio Demon">
    </div>

    <script>
        const overlay = document.getElementById('start-overlay');
        const startBtn = document.getElementById('start-btn');
        const mainFrame = document.getElementById('main-frame');
        const progressFill = document.getElementById('progress-fill');
        const percentText = document.getElementById('percent-text');
        const terminal = document.getElementById('terminal');
        const statusText = document.getElementById('status-text');
        const finalScare = document.getElementById('final-scare');
        const canvas = document.getElementById('static-canvas');
        const ctx = canvas.getContext('2d');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        function drawStatic() {
            const imageData = ctx.createImageData(canvas.width, canvas.height);
            const buffer = new Uint32Array(imageData.data.buffer);
            for (let i = 0; i < buffer.length; i++) {
                if (Math.random() > 0.8) buffer[i] = 0xff0000ff;
                else if (Math.random() > 0.95) buffer[i] = 0xffffffff;
            }
            ctx.putImageData(imageData, 0, 0);
        }

        const baseLogs = [
            "[!] ACCESSING ROOT AUDIO DRIVERS...",
            "[*] INJECTING 666.0 MHz CARRIER SIGNAL...",
            "[!] FIREWALL BREACH DETECTED - BYPASSING...",
            "[*] FORGING VOODOO HANDSHAKE PACKETS...",
            "[CRITICAL] MEMORY LEAK IN SECTOR 7G...",
            "[*] DECRYPTING SOUL CONTRACTS...",
            "[CRITICAL] TRANSMISSION PROTOCOL CORRUPTED",
            ">>> HE IS HERE <<<"
        ];

        function generateMemoryLine() {
            const addr = "0x" + Math.floor(Math.random()*0xFFFFFFFF).toString(16).toUpperCase().padStart(8, '0');
            let hex = "";
            for(let i=0; i<6; i++) {
                hex += Math.floor(Math.random()*256).toString(16).toUpperCase().padStart(2, '0') + " ";
            }
            return `${addr}: ${hex} ...`;
        }

        let progress = 0;
        let audioCtx, osc, droneOsc, gain, droneGain, toneInterval;

        function initAudio() {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            
            // Background Static/Hum
            osc = audioCtx.createOscillator();
            gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(50, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();

            // Creepy low drone
            droneOsc = audioCtx.createOscillator();
            droneGain = audioCtx.createGain();
            droneOsc.type = 'sine';
            droneOsc.frequency.setValueAtTime(110, audioCtx.currentTime);
            droneGain.gain.setValueAtTime(0.08, audioCtx.currentTime);
            droneOsc.connect(droneGain);
            droneGain.connect(audioCtx.destination);
            droneOsc.start();

            toneInterval = setInterval(() => {
                if (!audioCtx) return;
                const now = audioCtx.currentTime;
                droneOsc.frequency.exponentialRampToValueAtTime(220, now + 1.2);
                droneOsc.frequency.exponentialRampToValueAtTime(90, now + 2.5);
            }, 3000);
        }

        function audioGlitch() {
            if (!audioCtx) return;
            osc.frequency.setValueAtTime(Math.random() * 1000 + 200, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
            setTimeout(() => {
                if(!audioCtx) return;
                osc.frequency.setValueAtTime(50, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            }, 50);
        }

        // Synthesize a creepy, robotic/static demon laugh
        function playDemonLaugh() {
            if (!audioCtx) return;
            let now = audioCtx.currentTime;
            
            // Create a burst of white noise for the static crunch
            const bufferSize = audioCtx.sampleRate * 2; // 2 seconds of noise
            const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const output = noiseBuffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
                output[i] = Math.random() * 2 - 1;
            }
            const whiteNoise = audioCtx.createBufferSource();
            whiteNoise.buffer = noiseBuffer;
            const noiseFilter = audioCtx.createBiquadFilter();
            noiseFilter.type = 'bandpass';
            noiseFilter.frequency.value = 1000;
            const noiseGain = audioCtx.createGain();
            noiseGain.gain.setValueAtTime(0.5, now);
            noiseGain.gain.exponentialRampToValueAtTime(0.01, now + 2);
            whiteNoise.connect(noiseFilter);
            noiseFilter.connect(noiseGain);
            noiseGain.connect(audioCtx.destination);
            whiteNoise.start(now);

            // Staccato laughing tones
            for(let i=0; i<9; i++) {
                let laughOsc = audioCtx.createOscillator();
                let laughGain = audioCtx.createGain();
                
                // Descending pitch for the laugh "ha... ha... ha..."
                laughOsc.type = 'square';
                laughOsc.frequency.setValueAtTime(250 - (i*15), now + (i*0.18)); 

                // Frequency vibrato to make it sound unhinged
                let lfo = audioCtx.createOscillator();
                lfo.frequency.value = 15; // fast shake
                let lfoGain = audioCtx.createGain();
                lfoGain.gain.value = 40;
                lfo.connect(lfoGain);
                lfoGain.connect(laughOsc.frequency);
                lfo.start(now + (i*0.18));
                lfo.stop(now + (i*0.18) + 0.15);

                laughGain.gain.setValueAtTime(0, now + (i*0.18));
                laughGain.gain.linearRampToValueAtTime(0.8, now + (i*0.18) + 0.02);
                laughGain.gain.exponentialRampToValueAtTime(0.01, now + (i*0.18) + 0.12);
                
                laughOsc.connect(laughGain);
                laughGain.connect(audioCtx.destination);
                laughOsc.start(now + (i*0.18));
                laughOsc.stop(now + (i*0.18) + 0.15);
            }
        }

        startBtn.addEventListener('click', () => {
            overlay.style.display = 'none';
            mainFrame.style.display = 'flex';
            statusText.innerText = "OVERWRITING...";
            statusText.style.color = "red";
            
            if (document.documentElement.requestFullscreen) {
                document.documentElement.requestFullscreen().catch(() => {});
            }
            initAudio();
            startSequence();
        });

        function startSequence() {
            // Visual Glitch loop
            setInterval(() => {
                if (Math.random() > 0.8) {
                    mainFrame.classList.add('heavy-glitch');
                    audioGlitch();
                    setTimeout(() => mainFrame.classList.remove('heavy-glitch'), 150);
                }
            }, 400);

            // Terminal feed
            setInterval(() => {
                if (progress >= 100) return;
                const line = document.createElement('div');
                line.className = 'log-line';
                
                if (Math.random() > 0.3) {
                    line.innerText = "> " + baseLogs[Math.floor(Math.random() * baseLogs.length)];
                } else {
                    line.innerText = "# " + generateMemoryLine();
                }

                terminal.appendChild(line);
                if (terminal.childNodes.length > 10) {
                    terminal.removeChild(terminal.firstChild);
                }
            }, 80);

            // Stuttering Progress
            function stepLoading() {
                if (progress >= 100) return;

                let increment = Math.random() > 0.8 ? Math.random() * 15 : Math.random() * 2;
                progress += increment;

                if (progress >= 100) {
                    progress = 100;
                    progressFill.style.width = '100%';
                    percentText.innerText = '100.00%';
                    statusText.innerText = "BROADCAST COMPLETED";
                    
                    setTimeout(executeAutomaticShutdown, 1000);
                    return;
                }

                progressFill.style.width = progress + '%';
                percentText.innerText = progress.toFixed(2) + '%';

                let nextTick = Math.random() > 0.85 ? 500 : Math.floor(Math.random() * 60 + 30);
                setTimeout(stepLoading, nextTick);
            }

            stepLoading();
        }

        function executeAutomaticShutdown() {
            // 1. Extreme static visual
            canvas.style.opacity = 1;
            drawStatic();

            if (audioCtx) {
                clearInterval(toneInterval);
                gain.gain.setValueAtTime(0, audioCtx.currentTime);
                droneGain.gain.setValueAtTime(0, audioCtx.currentTime);

                // 2. The requested holding whistle tone
                const toneOsc = audioCtx.createOscillator();
                const toneGain = audioCtx.createGain();
                toneOsc.type = 'sine';
                toneOsc.frequency.setValueAtTime(1000, audioCtx.currentTime); // High pitch "teeeeeeeeeet"
                toneGain.gain.setValueAtTime(0.5, audioCtx.currentTime);
                toneOsc.connect(toneGain);
                toneGain.connect(audioCtx.destination);
                toneOsc.start();

                // 3. Screen Shrinks and Cuts to Black
                setTimeout(() => {
                    mainFrame.classList.add('tv-off-force');
                    
                    setTimeout(() => {
                        toneGain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.5);
                        document.body.style.backgroundColor = '#000000';
                        canvas.style.opacity = 0; // Pure black screen
                        
                        // 4. Wait 1.5 seconds in the pure dark, then jump scare + laugh
                        setTimeout(() => {
                            toneOsc.stop(); // kill whistle completely
                            finalScare.style.display = 'flex'; // Show the requested image
                            playDemonLaugh(); // Trigger synthetic stutter laugh
                        }, 1500);

                    }, 500);
                }, 800);
            }
        }
    </script>
</body>
</html>
