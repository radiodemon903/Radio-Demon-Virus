<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE RADIO DEMON IS IN CONTROL</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; color: #f00; font-family: 'Courier New', monospace; user-select: none; }
        
        #glitch-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        #text-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; display: flex; flex-direction: column; justify-content: center; align-items: center; pointer-events: none; text-align: center; }
        
        .title { font-size: 5vw; font-weight: bold; text-shadow: 0 0 15px #f00; opacity: 0; transition: opacity 0.3s; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 0.5em;}
        .status { font-size: 2vw; opacity: 0; transition: opacity 0.3s; margin-bottom: 30px; }
        .loading-bar { width: 60%; height: 20px; border: 2px solid #f00; position: relative; opacity: 0; transition: opacity 0.3s; overflow: hidden;}
        .loading-fill { height: 100%; background: #f00; width: 0%; box-shadow: 0 0 20px #f00; transition: width 0.1s linear;}
        .percent { font-size: 3vw; margin-top: 10px; opacity: 0; transition: opacity 0.3s; }
        
        #terminal-zone { width: 80%; height: 30vh; background: rgba(10,0,0,0.8); border: 1px solid #400; font-size: 1.2vw; color: #800; overflow: hidden; padding: 10px; margin-top: 20px; display: flex; flex-direction: column-reverse; box-sizing: border-box; }
        .log-line { margin: 2px 0; white-space: nowrap;}
        
        #voodoo-symbols { display: none; } /* Data source for symbols */
        #interact-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 100; display: flex; justify-content: center; align-items: center; color: #fff; font-size: 2em; cursor: pointer; text-shadow: 0 0 10px #f00; }
        #interact-overlay:hover { background: #100; color: #f00; }
        
        /* Apply text glitch on interaction */
        #interact-overlay.glitched { animation: textGlitch 0.2s infinite; }
        @keyframes textGlitch { 0% { transform: translate(2px, 1px); } 50% { transform: translate(-1px, -2px); } 100% { transform: translate(1px, -1px); } }
    </style>
</head>
<body>

<div id="interact-overlay">
    <div>T&nbsp;U&nbsp;N&nbsp;E&nbsp;&nbsp;&nbsp;I&nbsp;N</div>
</div>

<canvas id="glitch-canvas"></canvas>
<div id="text-overlay">
    <div class="title" id="alastor-title">Alastor</div>
    <div class="status" id="status-text">DOWNLOADING RADIO VIRUS...</div>
    <div class="loading-bar"><div class="loading-fill" id="fill"></div></div>
    <div class="percent" id="percent-text">0%</div>
    <div id="terminal-zone"></div>
</div>

<!-- Embedded symbol map data (procedural) -->
<img id="voodoo-symbols" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAADIAAAAyCAYAAAAeP4ixAAAAWUlEQVRYR+3ZAQ0AIAwDwYbDHz4MQAAN2bV0HXB9LwP+mS6AAlK6A5pIAYm6QEpI6Q5oIgUk6gIpIaU7oIkUkKgLpISU7oAmUkCiLpASUroDmkgBibpASkjppgt4AfoA9uR/6QAAAABJRU5ErkJggg==">

<script>
    const canvas = document.getElementById('glitch-canvas');
    const ctx = canvas.getContext('2d', { alpha: false });
    const overlay = document.getElementById('interact-overlay');
    const symbolMap = document.getElementById('voodoo-symbols');
    
    let width, height, glitchInterval;
    let progress = 0;
    let audioInitiated = false;
    let sequenceIndex = 0;
    let crashTimer;

    // --- Complex Python/System Code Database ---
    const logs = [
        "import sys, os, time, random, ctypes",
        "## FREQUENCY OVERRIDE INITIATED ##",
        "## TARGET: System_Core_Network ##",
        "sys.modules['alastor'] = 'demon_core'",
        "ctypes.windll.kernel32.SetPriorityClass(-1, 0x00000080)", // REAL HW Priority trick
        "[KERN] Hooking audio buffer: AC97/HDA...",
        "[MEM] alloc(0x666_0000, 0xFFFF)",
        "Dumping memory: 0x0001FF40 -> [...DATA_MOSFED...]",
        "[NET] socket(AF_INET, SOCK_RAW, 0x01) # ICMP",
        "[NET] connect(RADIO_DEMON_IP, 666)",
        "Injecting shellcode (AM_SIGNAL_VOODOO)...",
        "[OK] Radio Broadcast Signal established.",
        "[OK] Data harvesting: 15% complete...",
        "DECRYPTING_PRIVATE_KEYS...",
        "WARNING: System stability at 40%",
        "[OK] Data harvesting: 35% complete...",
        "[KERN] Process hijacked: Explorer.exe",
        "[MEM] write(0x7C800000, '\\x90\\x90\\x90\\xEB\\xFE')", // REAL Memory crash code
        "[OK] Data harvesting: 65% complete...",
        "A&nbsp;l&nbsp;a&nbsp;s&nbsp;t&nbsp;o&nbsp;r",
        "sys.setrecursionlimit(9999) # DEMON_LOOP",
        "## FINALIZING BROADCAST SYNC ##",
        "[OK] Data harvesting: 95% complete...",
        "System shutdown sequence overwritten."
    ];

    // --- VISUAL ENGINE (Glitches and Symbols) ---

    function resize() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // The core glitch routine: Pixel sorting, Datamoshing, Red Line tears
    function drawGlitch() {
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, width, height);
        
        if (progress === 0) return; // Wait for interaction

        const imgData = ctx.getImageData(0, 0, width, height);
        const data = imgData.data;

        // 1. Extreme Red Tearing Lines (Ref 1 and 3)
        if (Math.random() > 0.6) {
            for (let i = 0; i < 5 + Math.random() * 20; i++) {
                const y = Math.floor(Math.random() * height);
                const h = Math.floor(Math.random() * 10) + 1;
                const r = Math.random() * 255;
                for (let ly = y; ly < y + h && ly < height; ly++) {
                    const row = ly * width * 4;
                    for (let x = 0; x < width; x++) {
                        data[row + x * 4] = r; // Pure red line
                        data[row + x * 4 + 1] = 0;
                        data[row + x * 4 + 2] = 0;
                    }
                }
            }
        }

        // 2. Complex Datamoshing / Dislocation Glitches (Ref 2)
        if (Math.random() > 0.8) {
            for (let i = 0; i < 3; i++) {
                const x = Math.floor(Math.random() * width * 0.8);
                const y = Math.floor(Math.random() * height * 0.8);
                const w = Math.floor(Math.random() * width * 0.2);
                const h = Math.floor(Math.random() * height * 0.2);
                const dx = (Math.random() - 0.5) * 100;
                const dy = (Math.random() - 0.5) * 50;

                ctx.drawImage(canvas, x, y, w, h, x + dx, y + dy, w, h);
            }
        }

        // 3. Pixel Sorting / Chromatic Abberation (Red/Cyan shifts)
        if (Math.random() > 0.9) {
            for (let y = 0; y < height; y++) {
                if (Math.random() > 0.95) {
                    const row = y * width * 4;
                    const shift = Math.floor(Math.random() * 20) - 10;
                    for (let x = 0; x < width; x++) {
                        const targetX = (x + shift + width) % width;
                        const targetPixel = row + targetX * 4;
                        const currentPixel = row + x * 4;
                        data[currentPixel] = data[targetPixel]; // Shift Red
                        // data[currentPixel + 1] remains (G)
                        data[currentPixel + 2] = data[targetPixel + 2]; // Shift Blue (Cyan result)
                    }
                }
            }
        }
        ctx.putImageData(imgData, 0, 0);
        
        // 4. Procedural Voodoo Symbols (The core symbols from Ref 3)
        // We render these procedurally on the canvas
        if (Math.random() > 0.7) {
            drawVoodooSymbol();
        }
    }

    function drawVoodooSymbol() {
        ctx.save();
        ctx.strokeStyle = '#f00';
        ctx.lineWidth = 1 + Math.random() * 2;
        ctx.shadowBlur = 10 + Math.random() * 10;
        ctx.shadowColor = '#f00';
        ctx.translate(width * 0.1 + Math.random() * width * 0.8, height * 0.1 + Math.random() * height * 0.8);
        ctx.rotate(Math.random() * Math.PI * 2);
        
        const size = 30 + Math.random() * 100;
        ctx.beginPath();
        
        // Randomly draw one of the core shapes
        const type = Math.random();
        if (type < 0.33) {
            // Crossed circle / Eye symbol
            ctx.arc(0, 0, size/2, 0, Math.PI * 2);
            ctx.moveTo(-size/2, 0); ctx.lineTo(size/2, 0);
            ctx.moveTo(0, -size/2); ctx.lineTo(0, size/2);
        } else if (type < 0.66) {
            // Arrow complex
            ctx.moveTo(-size, 0); ctx.lineTo(size, 0);
            ctx.moveTo(size * 0.8, -size * 0.2); ctx.lineTo(size, 0); ctx.lineTo(size * 0.8, size * 0.2);
            ctx.moveTo(-size * 0.8, -size * 0.2); ctx.lineTo(-size, 0); ctx.lineTo(-size * 0.8, size * 0.2);
            ctx.moveTo(0, -size); ctx.lineTo(0, size);
        } else {
            // Sigil loop
            ctx.moveTo(-size/2, -size/2); ctx.quadraticCurveTo(size, 0, -size/2, size/2); ctx.closePath();
            ctx.stroke();
            ctx.beginPath(); ctx.arc(size/2, 0, size/4, 0, Math.PI*2);
        }
        ctx.stroke();
        ctx.restore();
    }

    // --- AUDIO ENGINE (Extreme Synthesis) ---
    let audioCtx, osc1, osc2, noiseNode, mainGain, dist;

    function initExtremeAudio() {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        mainGain = audioCtx.createGain();
        mainGain.connect(audioCtx.destination);
        mainGain.gain.value = 0; // Start muted

        dist = audioCtx.createWaveShaper();
        dist.curve = makeDistortionCurve(400); // Heavy distortion
        dist.connect(mainGain);

        // 1. Unstable low-end hum (The constant creepy feeling)
        osc1 = audioCtx.createOscillator();
        osc1.type = 'sawtooth';
        osc1.frequency.setValueAtTime(33, audioCtx.currentTime); // Low C hum
        const lfo = audioCtx.createOscillator();
        lfo.frequency.setValueAtTime(0.5, audioCtx.currentTime); // 0.5Hz modulation
        const lfoGain = audioCtx.createGain();
        lfoGain.gain.setValueAtTime(2, audioCtx.currentTime);
        lfo.connect(lfoGain);
        lfoGain.connect(osc1.frequency); // Modulate hum
        lfo.start();
        osc1.connect(dist);
        osc1.start();

        // 2. Mid-range static burst oscillator
        osc2 = audioCtx.createOscillator();
        osc2.type = 'square';
        osc2.frequency.setValueAtTime(200, audioCtx.currentTime);
        const lfo2 = audioCtx.createOscillator();
        lfo2.frequency.setValueAtTime(Math.random() * 5 + 1, audioCtx.currentTime);
        lfo2.connect(osc2.frequency); // Random pitch shifts
        lfo2.start();
        osc2.connect(dist);
        osc2.start();

        // 3. True Noise Generator (White noise -> heavy filter)
        noiseNode = audioCtx.createBufferSource();
        const bufferSize = 2 * audioCtx.sampleRate, noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate), output = noiseBuffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) output[i] = Math.random() * 2 - 1;
        noiseNode.buffer = noiseBuffer; noiseNode.loop = true;
        const noiseFilter = audioCtx.createBiquadFilter(); noiseFilter.type = 'lowpass'; noiseFilter.frequency.setValueAtTime(500, audioCtx.currentTime);
        noiseNode.connect(noiseFilter); noiseFilter.connect(dist);
        noiseNode.start();
    }

    function makeDistortionCurve(amount) {
        let k = amount, n_samples = 44100, curve = new Float32Array(n_samples), deg = Math.PI / 180, i = 0, x;
        for (; i < n_samples; ++i) { x = i * 2 / n_samples - 1; curve[i] = ( 3 + k ) * x * 20 * deg / ( Math.PI + k * Math.abs(x) ); }
        return curve;
    }

    // Audio modulation function for glitches
    function triggerAudioPanic() {
        if (!audioCtx) return;
        const now = audioCtx.currentTime;
        osc1.frequency.linearRampToValueAtTime(800 + Math.random()*200, now + 0.05); // High pitch scream
        dist.curve = makeDistortionCurve(Math.random()*800+400); // Randomize distortion
        mainGain.gain.setValueAtTime(0.6, now); // Set high gain
        
        setTimeout(() => {
            if(!audioCtx) return;
            const now2 = audioCtx.currentTime;
            osc1.frequency.linearRampToValueAtTime(33, now2 + 0.1); // Back to low hum
            mainGain.gain.setValueAtTime(0.08 + Math.random()*0.1, now2); // Back to mid gain
        }, 100 + Math.random()*200);
    }

    // --- MAIN EXECUTION SEQUENCE ---

    overlay.addEventListener('click', startSequence);
    overlay.addEventListener('contextmenu', e => e.preventDefault()); // Prevent right click

    function startSequence() {
        if (audioInitiated) return;
        audioInitiated = true;
        overlay.innerText = "";
        overlay.classList.add('glitched');
        
        // Final sanity check for fullscreen (browser security)
        if (document.documentElement.requestFullscreen) {
            document.documentElement.requestFullscreen();
        } else if (document.documentElement.webkitRequestFullscreen) {
            document.documentElement.webkitRequestFullscreen();
        }

        initExtremeAudio();
        glitchInterval = setInterval(drawGlitch, 50); // Start visual loop
        sequenceUpdate();
    }

    function sequenceUpdate() {
        const title = document.getElementById('alastor-title');
        const status = document.getElementById('status-text');
        const bar = document.querySelector('.loading-bar');
        const percentText = document.getElementById('percent-text');
        const fill = document.getElementById('fill');
        const terminalZone = document.getElementById('terminal-zone');

        if (sequenceIndex === 0) {
            // Hide interaction, show main content
            overlay.style.display = 'none';
            title.style.opacity = 1; status.style.opacity = 1;
            bar.style.opacity = 1; percentText.style.opacity = 1;
            title.innerHTML = `<span>A&nbsp;l&nbsp;a&nbsp;s&nbsp;t&nbsp;o&nbsp;r</span>`;
            status.innerHTML = `<span>DOWNLOADING RADIO VIRUS...</span>`;
            triggerAudioPanic();
        }

        // --- Loading Progress Loop ---
        const interval = setInterval(() => {
            progress += Math.random() * 2.5; // Random increase
            if (progress > 100) progress = 100;
            
            fill.style.width = progress + '%';
            percentText.innerText = Math.floor(progress) + '%';
            
            // Random extreme glitch (audio + visual peak)
            if (Math.random() > 0.95 && progress < 100) {
                triggerAudioPanic();
            }

            // Sync text logs with progress
            if (progress / 100 * logs.length > sequenceIndex) {
                const logLine = document.createElement('div');
                logLine.className = 'log-line';
                // HTML injection allows for <span> formatting for scarier text if needed
                logLine.innerHTML = `>> ` + logs[sequenceIndex];
                terminalZone.prepend(logLine); // Add to top
                sequenceIndex++;
            }

            // --- REH_LOAD (Ref 2/3) sequence: Alastor title change ---
            if (progress >= 40 && progress < 41) {
                 title.innerHTML = `<span>T&nbsp;h&nbsp;e&nbsp;&nbsp;&nbsp;R&nbsp;a&nbsp;d&nbsp;i&nbsp;o&nbsp;&nbsp;&nbsp;D&nbsp;e&nbsp;m&nbsp;o&nbsp;n</span>`;
                 status.innerHTML = `<span>BROADCAST_OVERRIDE_ACTIVE</span>`;
            }

            // --- ENDING SEQUENCE (Ref 1/2) ---
            if (progress === 100) {
                clearInterval(interval);
                status.innerText = "DOWNLOAD COMPLETE. STAY TUNED.";
                // Short pause before the extreme crash
                setTimeout(initiateExtremeCrash, 800);
            }
        }, 100 + Math.random() * 100);
    }

    function initiateExtremeCrash() {
        // Visuals peak
        ctx.fillStyle = '#fff'; // Flash white
        ctx.fillRect(0, 0, width, height);
        
        // Audio peak scream
        triggerAudioPanic();
        
        // Wait, then cut power
        setTimeout(() => {
            clearInterval(glitchInterval); // Stop drawing loop
            
            // Kill audio
            if(audioCtx) {
                audioCtx.close();
                audioCtx = null;
            }

            // Visual 'collapse' (mimicking analog screen turn-off from your series)
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, width, height); // Instant black
            
            // Optional: Draw a tiny white dot in the center, then fade it out
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(width/2, height/2, 10, 0, Math.PI*2);
            ctx.fill();
            
            setTimeout(() => {
                 ctx.fillStyle = '#000';
                 ctx.fillRect(0, 0, width, height); // Complete darkness
                 // Page is now inert
            }, 100);
            
        }, 500); // Wait 0.5s at peak
    }
</script>
</body>
