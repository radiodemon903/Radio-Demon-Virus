<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RADIO_BROADCAST // ALASTOR</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');

  :root {
    --bg-color: #0d0102;
    --radio-red: #ff0033;
    --dark-red: #4a000d;
    --alastor-green: #00ff40; 
    --text-dim: #8c4a4a;
  }

  body, html {
    margin: 0;
    padding: 0;
    background-color: var(--bg-color);
    color: var(--radio-red);
    font-family: 'Share Tech Mono', monospace;
    height: 100vh;
    overflow: hidden;
    user-select: none;
  }

  /* شاشة البداية الإجبارية لتفعيل الصوت */
  #start-screen {
    position: fixed;
    top: 0; left: 0; width: 100vw; height: 100vh;
    background-color: #000;
    color: var(--alastor-green);
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 1.5rem;
    z-index: 1000;
    cursor: pointer;
    text-shadow: 0 0 15px var(--alastor-green);
    animation: alertPulse 1s infinite;
  }

  .crt-overlay {
    position: fixed;
    top: 0; left: 0; width: 100vw; height: 100vh;
    background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.7) 50%);
    background-size: 100% 3px;
    z-index: 100;
    pointer-events: none;
    box-shadow: inset 0 0 140px rgba(0,0,0,0.95);
    animation: flicker 0.08s infinite;
  }

  @keyframes flicker {
    0% { opacity: 0.9; }
    50% { opacity: 1; }
    100% { opacity: 0.85; }
  }

  .main-ui {
    position: relative;
    width: 96%;
    max-width: 600px;
    height: 96vh;
    margin: 2vh auto;
    padding: 20px;
    box-sizing: border-box;
    display: none;
    flex-direction: column;
    z-index: 10;
  }

  .main-ui::before, .main-ui::after,
  .ui-corner-tl, .ui-corner-br {
    border-color: var(--alastor-green);
    border-style: solid;
    border-width: 2px;
    position: absolute;
  }

  .main-ui::before { content:''; top: 0; left: 0; width: 100%; height: 100%; border-right: none; border-bottom: none; pointer-events:none;}
  .main-ui::after { content:''; bottom: 0; right: 0; width: 100%; height: 100%; border-left: none; border-top: none; pointer-events:none;}
  .ui-corner-tl { top: 0; right: 0; width: 30px; height: 30px; border-left: none; border-bottom: none; }
  .ui-corner-br { bottom: 0; left: 0; width: 30px; height: 30px; border-right: none; border-top: none; }

  .hex-bg {
    position: absolute;
    top: 50px; left: 0; width: 100%; height: 80%;
    font-size: 0.55rem;
    color: rgba(0, 255, 64, 0.05);
    word-break: break-all;
    overflow: hidden;
    z-index: -1;
    line-height: 1;
  }

  .header-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    border-bottom: 1px solid var(--dark-red);
    padding-bottom: 10px;
    font-size: 0.75rem;
    color: var(--text-dim);
    margin-bottom: 20px;
  }
  .header-grid div:nth-child(2) { text-align: right; }

  .alert-box {
    border: 1px solid var(--alastor-green);
    background: rgba(0, 255, 64, 0.08);
    padding: 10px;
    text-align: center;
    margin-bottom: 15px;
  }
  .alert-title {
    color: var(--alastor-green);
    font-size: 1.4rem;
    font-weight: bold;
    letter-spacing: 3px;
    text-shadow: 0 0 10px var(--alastor-green);
    animation: alertPulse 0.5s infinite;
  }

  @keyframes alertPulse {
    0%, 100% { opacity: 1; text-shadow: 0 0 15px var(--alastor-green); }
    50% { opacity: 0.4; text-shadow: none; }
  }

  .hacker-brand {
    text-align: center;
    font-size: 1.7rem;
    color: var(--radio-red);
    text-shadow: 0 0 15px var(--radio-red), 0 0 30px #000;
    margin: 20px 0;
    animation: brandGlitch 1.5s infinite;
    font-weight: bold;
    letter-spacing: 2px;
  }

  @keyframes brandGlitch {
    0% { transform: skew(0deg); }
    10% { transform: skew(-15deg); filter: blur(1px); }
    12% { transform: skew(10deg); filter: none; }
    100% { transform: skew(0deg); }
  }

  .progress-section { margin-bottom: 20px; }
  .progress-header { display: flex; justify-content: space-between; font-size: 0.8rem; margin-bottom: 5px; color: #ccc; }
  .progress-track { width: 100%; height: 12px; border: 1px solid var(--text-dim); background: #000; position: relative; }
  .progress-fill { height: 100%; background: var(--radio-red); width: 0%; box-shadow: 0 0 15px var(--radio-red); transition: width 0.1s; }

  .terminal-box {
    flex-grow: 1; border: 1px solid var(--dark-red); background: rgba(40, 0, 10, 0.3);
    padding: 10px; overflow: hidden; font-size: 0.75rem; line-height: 1.5;
  }
  .log-row { display: flex; margin-bottom: 3px; }
  .log-time { color: var(--text-dim); margin-right: 10px; width: 65px; }
  .log-msg { color: #fff; flex-grow: 1; word-break: break-all; }
  .log-msg.green { color: var(--alastor-green); text-shadow: 0 0 5px var(--alastor-green); }
  .log-msg.red { color: var(--radio-red); }

  .severe-glitch {
    animation: screenTearChaos 0.12s infinite;
  }

  @keyframes screenTearChaos {
    0% { transform: translate(0, 0) skew(0deg); filter: hue-rotate(0deg); }
    25% { transform: translate(-8px, 4px) skew(5deg); filter: contrast(250%) saturate(200%); }
    50% { transform: translate(8px, -4px) skew(-8deg); filter: blur(2px); }
    75% { transform: translate(-4px, -6px) skew(3deg); filter: contrast(200%); }
    100% { transform: translate(0, 0) skew(0deg); filter: none; }
  }

  #final-screen {
    display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
    background-color: #000; z-index: 200; overflow: hidden;
    animation: finalScreenFlicker 0.1s infinite;
  }

  @keyframes finalScreenFlicker {
    0% { opacity: 1; background-color: #000; transform: translate(0, 0); }
    20% { opacity: 0.8; background-color: #050001; transform: translate(-2px, 1px); }
    40% { opacity: 0.95; background-color: #000; transform: translate(3px, -1px); filter: contrast(300%); }
    60% { opacity: 0.4; background-color: #1a0003; transform: translate(-1px, -2px); }
    80% { opacity: 0.9; background-color: #000; transform: translate(2px, 2px); }
    100% { opacity: 1; background-color: #000; transform: translate(0, 0); }
  }

  #final-screen::before {
    content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: linear-gradient(rgba(255,0,51,0) 0%, rgba(255,0,51,0.2) 50%, rgba(0,255,64,0.1) 51%, rgba(0,0,0,0) 100%);
    background-size: 100% 8px; pointer-events: none; animation: scanlineMove 0.3s linear infinite;
  }
  @keyframes scanlineMove { 0% { background-position: 0 0; } 100% { background-position: 0 30px; } }
</style>
</head>
<body>

<!-- شاشة النقر الأولى (لإجبار المتصفح على تفعيل الصوت) -->
<div id="start-screen">[ اضغط للاتصال بتردد الراديو ]</div>

<div class="crt-overlay"></div>

<!-- 1. صوت الزنين المستمر في الخلفية -->
<audio id="audio-bg-static" loop>
  <source src="https://www.myinstants.com/media/sounds/radio-static.mp3" type="audio/mpeg">
</audio>

<!-- 2. صوت الجليتش والتقطعات -->
<audio id="audio-glitch">
  <source src="https://www.myinstants.com/media/sounds/tv-static-05.mp3" type="audio/mpeg">
</audio>

<!-- 3. صوت الصفير Teeeeet -->
<audio id="audio-beep" loop>
  <source src="https://www.myinstants.com/media/sounds/censor-beep-1.mp3" type="audio/mpeg">
</audio>

<!-- 4. الجملة المرعبة لألاستور (الملف الذي رفعته أنت) -->
<audio id="audio-alastor-quote">
  <source src="alastor-audio.mp3" type="audio/mpeg">
</audio>

<div class="main-ui" id="main-ui">
  <div class="ui-corner-tl"></div>
  <div class="ui-corner-br"></div>
  <div class="hex-bg" id="hex-bg"></div>

  <div class="header-grid">
    <div>STATION: 666.9 MHz - HAZBIN</div>
    <div>STATUS: RADIO_WAVE_ACTIVE</div>
  </div>

  <div class="alert-box">
    <div class="alert-title">HAZBIN FREQUENCY HIJACKED</div>
  </div>

  <div class="hacker-brand">ALASTOR THE RADIO DEMON</div>

  <div class="progress-section">
    <div class="progress-header">
      <span id="target-ip">SOUL_FREQ: 192.666.##.##</span>
      <span id="pct-text" style="color: var(--radio-red); font-weight: bold;">0.00%</span>
    </div>
    <div class="progress-track">
      <div class="progress-fill" id="progress-bar"></div>
    </div>
  </div>

  <div class="terminal-box" id="terminal"></div>
</div>

<div id="final-screen"></div>

<script>
  const startScreen = document.getElementById('start-screen');
  const mainUI = document.getElementById('main-ui');
  const terminal = document.getElementById('terminal');
  const progressBar = document.getElementById('progress-bar');
  const pctText = document.getElementById('pct-text');
  
  const audioBgStatic = document.getElementById('audio-bg-static');
  const audioGlitch = document.getElementById('audio-glitch');
  const audioBeep = document.getElementById('audio-beep');
  const audioAlastorQuote = document.getElementById('audio-alastor-quote');

  let progress = 0;
  let sequenceStarted = false;

  startScreen.addEventListener('click', () => {
    if (sequenceStarted) return;
    sequenceStarted = true;
    
    startScreen.style.display = 'none';
    mainUI.style.display = 'flex';
    
    audioBgStatic.volume = 0.4;
    audioBgStatic.play();

    setTimeout(() => {
      addLog();
      updateProgress();
    }, 500);
  });

  const logsList = [
    { text: "TUNING INTO THE PENTAGRAM BROADCAST...", type: "red" },
    { text: "ESTABLISHING STATIC INTERFERENCE [FREQ 666Hz] ZZZZZ...", type: "green" },
    { text: "IF I WANTED TO HURT ANYONE HERE...", type: "red" },
    { text: "BROADCASTING OVER HELL'S AIRWAVES...", type: "green" },
    { text: "PSYCHOTIC SMILE INTENSITY: 100%", type: "red" },
    { text: "I WOULD HAVE DONE SO ALREADY!", type: "green" }
  ];

  function getTimestamp() {
    const now = new Date();
    return `${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}:${now.getSeconds().toString().padStart(2,'0')}.${Math.floor(Math.random()*999).toString().padStart(3,'0')}`;
  }

  function addLog() {
    if (progress >= 100) return;

    const row = document.createElement('div');
    row.className = 'log-row';
    
    const timeSpan = document.createElement('span');
    timeSpan.className = 'log-time';
    timeSpan.innerText = getTimestamp();

    const msgSpan = document.createElement('span');
    if (Math.random() > 0.4) {
      const logItem = logsList[Math.floor(Math.random() * logsList.length)];
      msgSpan.className = `log-msg ${logItem.type}`;
      msgSpan.innerText = `♪ ${logItem.text}`;
    } else {
      msgSpan.className = 'log-msg';
      msgSpan.style.color = '#ff4444';
      msgSpan.innerText = `[RADIO_STATIC_ZZZZZ] // SIGNAL_BURST_666`;
    }

    row.appendChild(timeSpan);
    row.appendChild(msgSpan);
    terminal.appendChild(row);
    terminal.scrollTop = terminal.scrollHeight;

    if (Math.random() > 0.7) {
      mainUI.classList.add('severe-glitch');
      audioGlitch.currentTime = 0; 
      audioGlitch.volume = 0.5;
      audioGlitch.play().catch(e=>{});
      setTimeout(() => mainUI.classList.remove('severe-glitch'), 200);
    }

    setTimeout(addLog, Math.random() * 150 + 50);
  }

  function updateProgress() {
    if (progress < 100) {
      progress += Math.random() * 0.8; 
      if (progress > 100) progress = 100;
      
      progressBar.style.width = `${progress}%`;
      pctText.innerText = `${progress.toFixed(2)}%`;

      setTimeout(updateProgress, Math.random() * 100 + 30);
    } else {
      triggerEndSequence();
    }
  }

  function triggerEndSequence() {
    mainUI.style.display = 'none';
    document.getElementById('final-screen').style.display = 'block';
    
    audioBgStatic.pause();
    
    // تشغيل صفير التوقف (Teeeeeeet)
    audioBeep.volume = 0.5;
    audioBeep.play();

    // تشغيل الجملة المرعبة لألاستور (ملفك الصوتي) بعد 0.5 ثانية
    setTimeout(() => {
      audioAlastorQuote.volume = 1.0;
      audioAlastorQuote.play().catch(e => console.log("تأكد من وضع ملف alastor-audio.mp3 في نفس المجلد"));
    }, 500);
  }
</script>
</body>
</html>
