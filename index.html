<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE RADIO DEMON</title>
    <style>
        :root {
            --alastor-dark: #0a0000;
            --alastor-red: #8b0000;
            --alastor-bright: #ff001e;
            --alastor-glow: rgba(255, 0, 30, 0.6);
            --bg-dark: #000000;
            --terminal-green: #ff3333; /* Adapted to red for Alastor */
            --terminal-red: #ff001e;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-dark);
            color: var(--alastor-bright);
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            user-select: none;
        }

        /* -------------------------------------- */
        /* CRT & GLITCH EFFECTS                   */
        /* -------------------------------------- */
        .scanlines {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.75) 50%),
                        linear-gradient(90deg, rgba(255,0,0,0.04), rgba(0,255,0,0.01), rgba(0,0,255,0.04));
            background-size: 100% 4px, 6px 100%;
            z-index: 50;
            pointer-events: none;
        }

        /* -------------------------------------- */
        /* ALASTOR "ON AIR" START BUTTON          */
        /* -------------------------------------- */
        #start-overlay {
            position: fixed;
            inset: 0;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            cursor: pointer;
        }

        .on-air-btn {
            border: 2px solid var(--alastor-red);
            border-radius: 5px;
            padding: 20px 50px;
            font-size: 2.5rem;
            color: var(--alastor-bright);
            background: #050000;
            font-family: 'Impact', sans-serif;
            letter-spacing: 8px;
            text-transform: uppercase;
            box-shadow: 0 0 30px var(--alastor-glow), inset 0 0 20px var(--alastor-glow);
            transition: all 0.2s ease;
            text-shadow: 0 0 10px var(--alastor-bright);
        }

        .on-air-btn:hover {
            background: var(--alastor-red);
            color: #fff;
            box-shadow: 0 0 50px var(--alastor-bright), inset 0 0 30px var(--alastor-bright);
        }

        /* -------------------------------------- */
        /* EXACT LAYOUT FROM REFERENCE IMAGE      */
        /* -------------------------------------- */
        #main-frame {
            width: 100%;
            height: 100%;
            padding: 20px;
            display: none; /* Hidden until clicked */
            flex-direction: column;
            background: radial-gradient(circle at center, #0a0000 0%, #000000 100%);
            position: relative;
            z-index: 10;
        }

        /* Target Reticle Corners */
        .reticle {
            position: absolute;
            width: 30px;
            height: 30px;
            border: 2px solid var(--alastor-red);
            box-shadow: 0 0 10px var(--alastor-glow);
        }
        .reticle.tl { top: 20px; left: 20px; border-right: none; border-bottom: none; }
        .reticle.tr { top: 20px; right: 20px; border-left: none; border-bottom: none; }
        .reticle.bl { bottom: 20px; left: 20px; border-right: none; border-top: none; }
        .reticle.br { bottom: 20px; right: 20px; border-left: none; border-top: none; }

        .inner-content {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            height: 100%;
            padding-top: 40px;
        }

        /* Status Header */
        .status-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: #880000;
            margin-bottom: 20px;
            letter-spacing: 1px;
            text-shadow: 0 0 5px var(--alastor-red);
        }

        /* Warning Box */
        .warning-box {
            border: 1px solid var(--alastor-red);
            background: rgba(40, 0, 0, 0.3);
            text-align: center;
            padding: 15px;
            margin-bottom: 30px;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.2);
            animation: pulse-border 2s infinite;
        }

        @keyframes pulse-border {
            0%, 100% { box-shadow: 0 0 10px rgba(255, 0, 0, 0.2); border-color: #550000; }
            50% { box-shadow: 0 0 30px rgba(255, 0, 30, 0.6); border-color: var(--alastor-bright); }
        }

        .warning-box h2 {
            font-size: 1.5rem;
            letter-spacing: 4px;
            color: var(--alastor-bright);
            margin-bottom: 5px;
            text-shadow: 0 0 10px var(--alastor-bright);
        }

        .warning-box p {
            font-size: 0.75rem;
            letter-spacing: 2px;
            color: #aa0000;
        }

        /* Main Title */
        .main-title {
            text-align: center;
            font-size: 2.5rem;
            font-family: 'Impact', sans-serif;
            letter-spacing: 6px;
            color: var(--alastor-bright);
            text-shadow: 0 0 15px var(--alastor-bright), 0 0 30px var(--alastor-red);
            margin-bottom: 30px;
        }

        /* Progress Area */
        .progress-info {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: #cc0000;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        .progress-bar-bg {
            width: 100%;
            height: 12px;
            background: #110000;
            border: 1px solid #440000;
            margin-bottom: 25px;
            position: relative;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: var(--alastor-bright);
            box-shadow: 0 0 15px var(--alastor-bright), 0 0 30px var(--alastor-red);
            transition: width 0.1s linear; /* Smooth visual filling */
        }

        /* Terminal Window */
        .terminal-box {
            flex-grow: 1;
            width: 100%;
            background: transparent;
            overflow: hidden;
            font-size: 0.75rem;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            margin-bottom: 40px;
        }

        .log-line {
            margin: 2px 0;
            display: flex;
            gap: 10px;
            opacity: 0.9;
        }

        .log-time {
            color: #660000;
            min-width: 90px;
        }

        .log-msg {
            color: var(--terminal-red);
            word-break: break-all;
            text-shadow: 0 0 4px var(--alastor-red);
        }

        .log-msg.highlight {
            color: #ffffff;
            text-shadow: 0 0 5px #ffffff;
        }

        /* -------------------------------------- */
        /* ENDING SEQUENCE STYLES                 */
        /* -------------------------------------- */
        .tv-off-force {
            animation: collapse-screen 0.5s cubic-bezier(0.7, 0, 0.84, 0) forwards !important;
        }

        @keyframes collapse-screen {
            0% { transform: scale(1, 1); filter: brightness(5); }
            50% { transform: scale(1, 0.005); filter: brightness(10); }
            80% { transform: scale(0.002, 0.005); filter: brightness(20); }
            100% { transform: scale(0, 0); filter: brightness(0); opacity: 0; display: none; }
        }

        #final-scare {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: #000;
            z-index: 200;
            display: none; 
            justify-content: center;
            align-items: center;
        }

        #jumpscare-img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            animation: final-glitch 0.06s infinite;
            mix-blend-mode: screen;
        }

        @keyframes final-glitch {
            0% { transform: translate(0, 0) scale(1); filter: hue-rotate(0deg) contrast(1.5); clip-path: inset(0 0 0 0); }
            25% { transform: translate(-8px, 4px) scale(1.02); filter: hue-rotate(90deg) contrast(2); clip-path: inset(10% 0 40% 0); }
            50% { transform: translate(8px, -4px) scale(0.98); filter: hue-rotate(-90deg) contrast(3) invert(1); clip-path: inset(50% 0 10% 0); }
            75% { transform: translate(-4px, -8px) scale(1.03); filter: hue-rotate(180deg) contrast(1.2); clip-path: inset(20% 0 60% 0); }
            100% { transform: translate(4px, 8px) scale(1); filter: hue-rotate(0deg) contrast(1.5); clip-path: inset(0 0 0 0); }
        }

        #static-canvas {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            opacity: 0; pointer-events: none; z-index: 5;
        }
    </style>
</head>
<body>

    <div class="scanlines"></div>
    <canvas id="static-canvas"></canvas>

    <div id="start-overlay">
        <div class="on-air-btn" id="start-btn">ON AIR</div>
    </div>

    <!-- Layout matched to Screenshot_2026-08-25-01-35-52-10.jpg -->
    <div id="main-frame">
        <div class="reticle tl"></div>
        <div class="reticle tr"></div>
        <div class="reticle bl"></div>
        <div class="reticle br"></div>

        <div class="inner-content">
            <div class="status-header">
                <span>PRTCL: RADIO_DEMON_V2</span>
                <span id="status-text">STATUS: OVERRIDE_ENGAGED</span>
            </div>

            <div class="warning-box">
                <h2>SYSTEM BREACHED</h2>
                <p>CRITICAL UNAUTHORIZED ACCESS DETECTED</p>
            </div>

            <div class="main-title">A L A S T O R</div>
            
            <div class="progress-info">
                <span>TRGT_IP: 192.168.119.232</span>
                <span id="percent-text">0.00%</span>
            </div>
            
            <div class="progress-bar-bg">
                <div class="progress-fill" id="progress-fill"></div>
            </div>

            <div class="terminal-box" id="terminal"></div>
        </div>
    </div>

    <!-- Final Jumpscare Container -->
    <div id="final-scare">
        <img id="jumpscare-img" src="d769884480dfdee13e47e0526d22f906.jpg" alt="The Radio Demon">
    </div>

    <script>
        const overlay = document.getElementById('start-overlay');
        const startBtn = document.getElementById('start-btn');
        const mainFrame = document.getElementById('main-frame');
        const progressFill = document.getElementById('progress-fill');
        const percentText = document.getElementById('percent-text');
        const terminal = document.getElementById('terminal');
        const finalScare = document.getElementById('final-scare');
        const canvas = document.getElementById('static-canvas');
        const ctx = canvas.getContext('2d');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        function drawStatic() {
            const imageData = ctx.createImageData(canvas.width, canvas.height);
            const buffer = new Uint32Array(imageData.data.buffer);
            for (let i = 0; i < buffer.length; i++) {
                if (Math.random() > 0.8) buffer[i] = 0xff0000ff;
                else if (Math.random() > 0.95) buffer[i] = 0xffffffff;
            }
            ctx.putImageData(imageData, 0, 0);
        }

        const logMessages = [
            "ENCRYPTING LOCAL DISK (RANSOM-MODE)",
            "DECRYPTING PRIVATE RSA KEYS...",
            "CAMERA NODE INTERCEPTED",
            "INJECTING VOODOO PAYLOAD...",
            "FIREWALL BYPASS: SUCCESS",
            "DUMPING SYSTEM MEMORY...",
            "DOWNLOADING USER.DAT HASHES",
            "OVERRIDING AUDIO DRIVER",
            "BROADCAST SIGNAL LOCKED"
        ];

        // Generates realistic timestamps HH:MM:SS.MMM
        function getTimestamp() {
            const now = new Date();
            const pad = (num, size) => num.toString().padStart(size, '0');
            return `${pad(now.getHours(), 2)}:${pad(now.getMinutes(), 2)}:${pad(now.getSeconds(), 2)}.${pad(now.getMilliseconds(), 3)}`;
        }

        function generateMemoryLine() {
            const addr = "0x" + Math.floor(Math.random()*0xFFFFFFFF).toString(16).toUpperCase().padStart(8, '0');
            return `${addr} : PTR_CORRUPTION_ERR`;
        }

        let currentProgress = 0;
        let targetProgress = 0;
        let audioCtx, droneOsc, droneGain, toneInterval;

        function initAudio() {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            
            droneOsc = audioCtx.createOscillator();
            droneGain = audioCtx.createGain();
            droneOsc.type = 'sawtooth';
            droneOsc.frequency.setValueAtTime(60, audioCtx.currentTime);
            droneGain.gain.setValueAtTime(0.05, audioCtx.currentTime);
            droneOsc.connect(droneGain);
            droneGain.connect(audioCtx.destination);
            droneOsc.start();

            toneInterval = setInterval(() => {
                if (!audioCtx) return;
                const now = audioCtx.currentTime;
                droneOsc.frequency.exponentialRampToValueAtTime(120, now + 1.0);
                droneOsc.frequency.exponentialRampToValueAtTime(50, now + 2.0);
            }, 2500);
        }

        function playDemonLaugh() {
            if (!audioCtx) return;
            let now = audioCtx.currentTime;
            
            const bufferSize = audioCtx.sampleRate * 2; 
            const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const output = noiseBuffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) output[i] = Math.random() * 2 - 1;
            
            const whiteNoise = audioCtx.createBufferSource();
            whiteNoise.buffer = noiseBuffer;
            const noiseFilter = audioCtx.createBiquadFilter();
            noiseFilter.type = 'bandpass';
            noiseFilter.frequency.value = 800;
            const noiseGain = audioCtx.createGain();
            noiseGain.gain.setValueAtTime(0.6, now);
            noiseGain.gain.exponentialRampToValueAtTime(0.01, now + 2);
            whiteNoise.connect(noiseFilter);
            noiseFilter.connect(noiseGain);
            noiseGain.connect(audioCtx.destination);
            whiteNoise.start(now);

            for(let i=0; i<8; i++) {
                let laughOsc = audioCtx.createOscillator();
                let laughGain = audioCtx.createGain();
                
                laughOsc.type = 'square';
                laughOsc.frequency.setValueAtTime(220 - (i*12), now + (i*0.2)); 

                let lfo = audioCtx.createOscillator();
                lfo.frequency.value = 20; 
                let lfoGain = audioCtx.createGain();
                lfoGain.gain.value = 50;
                lfo.connect(lfoGain);
                lfoGain.connect(laughOsc.frequency);
                lfo.start(now + (i*0.2));
                lfo.stop(now + (i*0.2) + 0.15);

                laughGain.gain.setValueAtTime(0, now + (i*0.2));
                laughGain.gain.linearRampToValueAtTime(0.9, now + (i*0.2) + 0.02);
                laughGain.gain.exponentialRampToValueAtTime(0.01, now + (i*0.2) + 0.14);
                
                laughOsc.connect(laughGain);
                laughGain.connect(audioCtx.destination);
                laughOsc.start(now + (i*0.2));
                laughOsc.stop(now + (i*0.2) + 0.15);
            }
        }

        startBtn.addEventListener('click', () => {
            overlay.style.display = 'none';
            mainFrame.style.display = 'flex';
            
            if (document.documentElement.requestFullscreen) {
                document.documentElement.requestFullscreen().catch(() => {});
            }
            initAudio();
            startSequence();
        });

        function startSequence() {
            // Smooth progress interpolation
            function animateProgress() {
                if (currentProgress < targetProgress) {
                    currentProgress += (targetProgress - currentProgress) * 0.1; 
                }
                if (currentProgress > 99.9) currentProgress = 100;

                progressFill.style.width = currentProgress + '%';
                percentText.innerText = currentProgress.toFixed(2) + '%';

                if (currentProgress < 100) {
                    requestAnimationFrame(animateProgress);
                } else {
                    document.getElementById('status-text').innerText = "STATUS: BROADCAST_COMPLETE";
                    setTimeout(executeAutomaticShutdown, 800);
                }
            }
            requestAnimationFrame(animateProgress);

            // Increment target progress stochastically
            function bumpProgress() {
                if (targetProgress >= 100) return;
                targetProgress += Math.random() * 8 + 2; 
                if (targetProgress > 100) targetProgress = 100;
                let nextTick = Math.random() > 0.7 ? 600 : 150;
                setTimeout(bumpProgress, nextTick);
            }
            bumpProgress();

            // Terminal log feed
            setInterval(() => {
                if (currentProgress >= 100) return;
                const line = document.createElement('div');
                line.className = 'log-line';
                
                const timeSpan = document.createElement('span');
                timeSpan.className = 'log-time';
                timeSpan.innerText = getTimestamp() + ">>";

                const msgSpan = document.createElement('span');
                msgSpan.className = 'log-msg';

                if (Math.random() > 0.4) {
                    msgSpan.innerText = logMessages[Math.floor(Math.random() * logMessages.length)];
                } else {
                    msgSpan.innerText = generateMemoryLine();
                    msgSpan.classList.add('highlight');
                }

                line.appendChild(timeSpan);
                line.appendChild(msgSpan);
                terminal.appendChild(line);

                if (terminal.childNodes.length > 15) {
                    terminal.removeChild(terminal.firstChild);
                }
            }, 100);
        }

        function executeAutomaticShutdown() {
            canvas.style.opacity = 0.8;
            drawStatic();

            if (audioCtx) {
                clearInterval(toneInterval);
                droneGain.gain.setValueAtTime(0, audioCtx.currentTime);

                // Sustained high whistle
                const toneOsc = audioCtx.createOscillator();
                const toneGain = audioCtx.createGain();
                toneOsc.type = 'sine';
                toneOsc.frequency.setValueAtTime(1000, audioCtx.currentTime);
                toneGain.gain.setValueAtTime(0.5, audioCtx.currentTime);
                toneOsc.connect(toneGain);
                toneGain.connect(audioCtx.destination);
                toneOsc.start();

                // TV Collapse
                setTimeout(() => {
                    mainFrame.classList.add('tv-off-force');
                    
                    // Black screen hold
                    setTimeout(() => {
                        toneGain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.5);
                        document.body.style.backgroundColor = '#000000';
                        canvas.style.opacity = 0; 
                        
                        // Jumpscare
                        setTimeout(() => {
                            toneOsc.stop(); 
                            finalScare.style.display = 'flex'; 
                            playDemonLaugh(); 
                        }, 1800);

                    }, 500);
                }, 800);
            }
        }
    </script>
</body>
</html>
